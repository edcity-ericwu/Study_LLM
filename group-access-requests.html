<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdCity 學生工具申請 — 課堂層級（示意）</title>
<!-- Site-wide typeface (2026-07-31): Chiron GoRound TC, a rounded
     Traditional Chinese sans built on Source Han Sans/Chiron Hei HK,
     replacing the plain system-font stack. Falls back to the previous
     stack (PingFang TC / Microsoft JhengHei / Noto Sans TC / system) if
     the network font fails to load. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap" rel="stylesheet">
<style>
  :root{
    --ec-blue:#008BD1;--ec-blue-dark:#0072ab;--ec-red:#ED1A2E;--ec-green:#00AC6C;
    --ec-maroon:#7B2539;--ec-amber:#F5A623;--ec-purple:#7C5CDB;--ec-teal:#0f8c8c;
    --ink:#1e2a35;--ink-2:#55636f;--ink-3:#8a97a3;--line:#e6ebf0;--bg:#f1f2f8;font-size:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);display:flex;min-height:100vh;}
  .sidebar{width:248px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .sidebar .logo-wrap{padding:20px 16px 20px;border-bottom:1px solid var(--line);}
  .sidebar .logo-wrap img{width:100%;height:auto;display:block;}
  .sidebar .logo-sub{font-size:.8rem;font-weight:700;color:var(--ink-2);margin-top:16px;letter-spacing:normal;}
  .role-chip{display:inline-flex;align-items:center;gap:6px;font-size:.64rem;font-weight:700;color:var(--ec-blue-dark);background:#e6f4fb;border:1px solid #c4e5f5;border-radius:99px;padding:4px 10px;margin-top:14px;}
  .nav{padding:14px 10px;flex:1;overflow-y:auto;}
  .nav-group h6{font-size:.66rem;font-weight:600;color:var(--ec-blue);letter-spacing:normal;padding:0 10px 8px;text-transform:uppercase;}
  .nav-group.governance{background:#f5f3fb;border:1px solid #e8e3f7;border-radius:12px;padding:10px 6px 8px;}
  .nav-group.governance h6{color:var(--ec-purple,#7C5CDB);}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-size:.85rem;margin-bottom:2px;}
  .nav a:hover{background:#f2f6f9;}
  .nav a.active{background:#e6f4fb;color:var(--ec-blue-dark);font-weight:600;}
  .nav a .ic{width:17px;height:17px;flex-shrink:0;}
  .sidebar .user{border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;}
  .sidebar .user .avatar{width:34px;height:34px;border-radius:50%;background:var(--ec-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;}
  .sidebar .user .meta b{font-size:.8rem;display:block;}
  .sidebar .user .meta span{font-size:.68rem;color:var(--ink-3);}

  .main{flex:1;min-width:0;padding:44px 34px 80px;}
  .ribbon{display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:700;color:#8a6d00;background:#fdf1c7;border:1px solid #f0dfa0;border-radius:99px;padding:5px 14px;margin-bottom:16px;}
  .hero{margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid var(--line);}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  h1{font-size:1.8rem;font-weight:800;color:var(--ec-blue);}
  .sub{font-size:.82rem;color:var(--ink-2);margin:6px 0 0;max-width:48em;line-height:1.6;}
  .class-dd{position:relative;}
  .class-btn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:.82rem;cursor:pointer;font-family:inherit;color:var(--ink);}
  .class-btn b{color:var(--ec-blue-dark);}
  .class-btn .car{font-size:.7rem;color:var(--ink-3);margin-left:2px;}
  .class-menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,30,40,.14);width:250px;padding:6px;display:none;z-index:40;}
  .class-menu.show{display:block;}
  .class-opt{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:.8rem;color:var(--ink-2);}
  .class-opt:hover{background:#f2f6f9;}
  .class-opt.on{background:#e6f4fb;color:var(--ec-blue-dark);font-weight:600;}
  .class-opt small{font-size:.68rem;color:var(--ink-3);font-weight:400;}

  h2{font-size:.95rem;font-weight:700;margin:22px 0 12px;}

  .tabs{display:flex;gap:22px;margin:16px 0 22px;border-bottom:1px solid var(--line);}
  .tab-btn{background:none;border:none;padding:10px 2px;font-size:.86rem;font-weight:600;color:var(--ink-3);
    cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--ec-blue-dark);}
  .tab-btn .tab-count{font-size:.64rem;font-weight:700;color:#b91c1c;background:#fee2e2;border-radius:99px;padding:1px 8px;}
  .tab-pane{display:none;}
  .tab-pane.active{display:block;}

  .scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:8px;}
  .scope-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .scope-card.whole{border:1px solid #c4e5f5;background:#f7fbfe;}
  .scope-card .sc-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .scope-card .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .scope-card b{font-size:.88rem;}
  .scope-card .n{margin-left:auto;font-size:.7rem;color:var(--ink-3);}
  .scope-card .goal{font-size:.7rem;color:var(--ink-3);margin-bottom:12px;line-height:1.5;}
  .scope-card select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 10px;font-size:.78rem;font-family:inherit;margin-bottom:8px;color:var(--ink);background-color:#fff;}
  .scope-card .go{width:100%;border:none;border-radius:8px;padding:9px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;background:var(--ec-blue);color:#fff;transition:background .15s ease;}
  .scope-card .go:hover{background:var(--ec-blue-dark);}
  .overlap-note{background:#fdf6ec;border:1px solid #f3e3c3;border-radius:8px;padding:8px 10px;font-size:.7rem;color:#8a5a00;line-height:1.6;margin-top:8px;}
  .scope-card.submitted{background:#f3fbf7;border-color:#bfe8d7;}
  .scope-card.submitted .sc-head b{color:#0c6b48;}
  .submit-next{font-size:.72rem;color:var(--ink-2);line-height:1.65;margin-top:8px;}
  .submit-next a{color:var(--ec-blue-dark);font-weight:700;}
  .submit-chip{display:inline-block;font-size:.64rem;font-weight:700;color:#8a5a00;background:#fdf1c7;border-radius:99px;padding:3px 10px;margin-left:auto;white-space:nowrap;}
  .not-covered{font-size:.7rem;color:var(--ink-3);line-height:1.6;margin-top:14px;max-width:52em;}

  .req-card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;}
  .req-card .rc-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .req-card .rc-head b{font-size:.86rem;display:block;}
  .req-card .rc-head small{font-size:.72rem;color:var(--ink-3);display:block;margin-top:2px;}
  .req-card .rc-badges{margin-left:auto;}
  .rchip{font-size:.64rem;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap;}
  .rchip.pending{color:#8a5a00;background:#fdf1c7;}
  .rchip.approved{color:#0c6b48;background:#e6f7ef;}
  .rchip.denied{color:#b91c1c;background:#fee2e2;}
  .drift-banner{background:#fee2e2;border-top:1px solid #f5c6c6;padding:11px 16px;font-size:.75rem;color:#991b1b;line-height:1.6;}
  .drift-banner b{display:block;margin-bottom:2px;}
  .overlap-flag{background:#fdf6ec;border-top:1px solid #f3e3c3;padding:9px 16px;font-size:.72rem;color:#8a5a00;line-height:1.6;}

  .empty-msg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;text-align:center;font-size:.8rem;color:var(--ink-3);}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.78rem;padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:120;}
  .toast.show{opacity:.94;}
  footer.note{margin-top:40px;font-size:.68rem;color:var(--ink-3);text-align:center;}
  @media (max-width:900px){.sidebar{display:none;}.main{padding:18px;}}

  /* Feature flags (see feature-flags.js) — hides without deleting anything. */
  body.ff-hide-trial .trial-go{display:none !important;}
  body.ff-hide-studygroups #studyGroupSection{display:none !important;}
</style>
</head>

<main class="main">
  <section class="hero">
    <div class="ribbon">🟡 提案中 · 此畫面為設計方案，功能未建置</div>

    <div class="page-head">
      <div>
        <h1>學生工具申請</h1>
        <div class="sub">為分組或全班申請批改工具的資料存取權，與「教學分組」的組建工作分開處理；這裏一律讀取分組的即時人數，不會用到過時的名單。</div>
      </div>
      <div class="class-dd">
        <button class="class-btn" id="classBtn" onclick="toggleClassMenu()">📋 <b id="classLabel"></b><span id="classMeta"></span><span class="car">▾</span></button>

    <div id="studyGroupSection">
    <h2>學習小組（跨班，2026-07-22 新增）</h2>
    <div class="sub" style="margin:0 0 10px;max-width:56em;">這裏列出你在「教學分組」建立的跨班學習小組——不受單一班別限制，適合像共讀單元這類跨班活動申請資料存取。</div>
    <div class="scope-grid" id="studyGroupScopeGrid"></div>
    </div>

  </section>

    <div id="myRequestsList"></div>

<div class="toast" id="toast"></div>
<script src="feature-flags.js"></script>
<script src="vendor-data.js"></script>
<script>
/* Feature-flag gating — trial-go buttons and the study-group section are both
 * re-rendered repeatedly (search/filter/class-switch), so a one-time DOM hide
 * on load wouldn't survive a re-render. A body class + CSS rule does, since it
 * doesn't care when the underlying elements get recreated. */
document.body.classList.toggle('ff-hide-trial', typeof featureOn==='function' && !featureOn('toolTrial'));
document.body.classList.toggle('ff-hide-studygroups', typeof featureOn==='function' && !featureOn('studyGroups'));

const REQUESTABLE_VENDORS = ['zhixie','diandu','unknownvendor'];
/* The logged-in teacher for this page — same persona as the sidebar badge
 * below (陳凱怡老師). Used to scope "我的請求與狀態": that section is titled
 * MY requests, but its filter was only ever checking classId, never who
 * actually made the request — meaning any teacher's request on the class
 * you're viewing showed up as if it were yours. That was easy to miss with
 * only one teacher per class in the earlier small-roster data, but is a real
 * bug now that multiple teachers (e.g. 陳凱怡 and 黃穎詩) can each have their
 * own request scoped to the same class (2b). */
const MY_TEACHER_ID = 'T1001';
let activeClassId = '2b';

// Same fix as groups.html's class switcher and cross-class study-group
// picker: this dropdown must only ever list classes MY_TEACHER_ID actually
// teaches, not every class in the school (CLASS_LIST) — otherwise another
// teacher's class (e.g. 黃穎詩's 1a) shows up as something 陳凱怡 could switch
// her own request view into.
function myClasses(){ return CLASS_LIST.filter(cl=>CLASSES[cl.id].teacherId===MY_TEACHER_ID); }
function renderClassSwitcher(){
  const c = CLASSES[activeClassId];
  document.getElementById('classLabel').textContent = c.className;
  document.getElementById('classMeta').textContent = '· '+c.subjectLabel;
  document.getElementById('classMenu').innerHTML = myClasses().map(cl=>
    `<div class="class-opt ${cl.id===activeClassId?'on':''}" data-c="${cl.id}" onclick="switchClass('${cl.id}')">${cl.className}<small>${cl.subjectLabel}</small></div>`
  ).join('');
}
function toggleClassMenu(){ document.getElementById('classMenu').classList.toggle('show'); }
function switchClass(classId){
  activeClassId = classId;
  document.getElementById('classMenu').classList.remove('show');
  renderClassSwitcher();
  renderScopeCards();
  renderMyRequests();
  toast('已切換至 '+CLASSES[classId].className);
}
document.addEventListener('click', e=>{ if(!e.target.closest('.class-dd')) document.getElementById('classMenu').classList.remove('show'); });

function vendorOptionsHtml(){
  return VENDORS.filter(v=>REQUESTABLE_VENDORS.includes(v.id))
    .map(v=>`<option value="${v.id}">${v.name} · ${v.product}</option>`).join('');
}
function isCertified(vendorId){
  const v = VENDORS.find(x=>x.id===vendorId);
  return !!v && v.vetting.status==='certified';
}

/* Trial button — added 2026-07-22 (Story 2, wave-one build): lets a teacher
 * start a lightweight, time-boxed trial with an already-CERTIFIED vendor,
 * without going through the full production-scale request below. Vetting
 * stays mandatory (confirmed by Eric) — the button itself is disabled for any
 * vendor that isn't certified yet, and confirmTrial() on eddata-console.html
 * re-checks this server-side-equivalent guard before activating. */
function renderScopeCards(){
  document.getElementById('groupScopeGrid').innerHTML = classGroups(activeClassId).map(g=>{
    const n = groupHeadcount(activeClassId, g.id);
    return `<div class="scope-card" id="scopeCard-${g.id}">
      <div class="sc-head"><span class="dot" style="background:${g.color}"></span><b>${g.name}</b><span class="n">${n} 人</span></div>
      <div class="goal">${g.goal}</div>
      <select id="vendorPick-${g.id}" onchange="refreshTrialButton('${g.id}')">${vendorOptionsHtml()}</select>
      <button class="go" onclick="submitRequest('${g.id}')">送出正式申請 →</button>
      <button class="go trial-go" id="trialBtn-${g.id}" onclick="submitTrialRequest('${g.id}')" style="margin-top:6px;background:#fff;border:1px solid var(--ec-purple);color:var(--ec-purple);">🧪 申請試用（14 天）</button>
      <div id="overlapNote-${g.id}"></div>
    </div>`;
  }).join('');
  const wc = wholeClassMembers(activeClassId).length;
  document.getElementById('wholeScopeGrid').innerHTML = `<div class="scope-card whole" id="scopeCard-__whole_class__">
    <div class="sc-head"><b>全班</b><span class="n">${wc} 人</span></div>
    <div class="goal">不分組別，整班學生的資料一併申請，適合全班統一使用的工具。</div>
    <select id="vendorPick-__whole_class__" onchange="refreshTrialButton('__whole_class__')">${vendorOptionsHtml()}</select>
    <button class="go" onclick="submitRequest('__whole_class__')">送出正式申請 →</button>
    <button class="go trial-go" id="trialBtn-__whole_class__" onclick="submitTrialRequest('__whole_class__')" style="margin-top:6px;background:#fff;border:1px solid var(--ec-purple);color:var(--ec-purple);">🧪 申請試用（14 天）</button>
    <div id="overlapNote-__whole_class__"></div>
  </div>`;
  classGroups(activeClassId).forEach(g=>refreshTrialButton(g.id));
  refreshTrialButton('__whole_class__');
}

/* Study-group scope cards (Story 1, wave-one build) — deliberately rendered
 * independent of activeClassId, since a study group by definition isn't
 * scoped to one class. Uses the '__study_group__'+id scope-key convention
 * documented in vendor-data.js so submitRequest/submitTrialRequest below can
 * share the same code path as ordinary class/group scopes. */
function renderStudyGroupScopeCards(){
  const grid = document.getElementById('studyGroupScopeGrid');
  if(!STUDY_GROUPS.length){
    grid.innerHTML = '<div class="scope-card" style="color:var(--ink-3);">尚未在「教學分組」建立任何跨班學習小組</div>';
    return;
  }
  grid.innerHTML = STUDY_GROUPS.map(sg=>{
    const scopeKey = '__study_group__'+sg.id;
    const n = studyGroupHeadcount(sg.id);
    return `<div class="scope-card" id="scopeCard-${scopeKey}" style="border-top:3px solid var(--ec-teal);">
      <div class="sc-head"><span class="dot" style="background:var(--ec-teal)"></span><b>${sg.name}</b><span class="n">${n} 人 · 跨班</span></div>
      <div class="goal">${sg.goal||'（未填寫目的）'}</div>
      <select id="vendorPick-${scopeKey}" onchange="refreshTrialButton('${scopeKey}')">${vendorOptionsHtml()}</select>
      <button class="go" onclick="submitRequest('${scopeKey}')">送出正式申請 →</button>
      <button class="go trial-go" id="trialBtn-${scopeKey}" onclick="submitTrialRequest('${scopeKey}')" style="margin-top:6px;background:#fff;border:1px solid var(--ec-purple);color:var(--ec-purple);">🧪 申請試用（14 天）</button>
      <div id="overlapNote-${scopeKey}"></div>
    </div>`;
  }).join('');
  STUDY_GROUPS.forEach(sg=>refreshTrialButton('__study_group__'+sg.id));
}

function refreshTrialButton(groupId){
  const vendorId = document.getElementById('vendorPick-'+groupId).value;
  const btn = document.getElementById('trialBtn-'+groupId);
  if(!btn) return;
  if(isCertified(vendorId)){
    btn.disabled = false;
    btn.title = '';
    btn.style.opacity = '1';
  } else {
    btn.disabled = true;
    btn.title = '此供應商尚未通過供應商審核，須先完成合規閘，才能開始試用';
    btn.style.opacity = '.5';
  }
}

function submitTrialRequest(groupId){
  const vendorId = document.getElementById('vendorPick-'+groupId).value;
  const v = VENDORS.find(x=>x.id===vendorId);
  if(!isCertified(vendorId)){ toast('此供應商尚未通過供應商審核，不能開始試用'); return; }

  let group, memberSnapshot, classId;
  if(isStudyGroupScope(groupId)){
    const sgId = studyGroupIdFromScope(groupId);
    group = studyGroupLabel(sgId);
    memberSnapshot = studyGroupMembers(sgId).map(s=>s.n);
    classId = null; // deliberate — see vendor-data.js's scope-key comment
  } else {
    group = groupId==='__whole_class__' ? '全班' : classGroups(activeClassId).find(x=>x.id===groupId).name;
    memberSnapshot = groupId==='__whole_class__' ? wholeClassMembers(activeClassId).map(s=>s.n) : groupMembers(activeClassId, groupId).map(s=>s.n);
    classId = activeClassId;
    group = group+'（'+memberSnapshot.length+' 人）· '+CLASSES[activeClassId].className;
  }
  const headcount = memberSnapshot.length;
  TRIALS.push({
    id:'tt-'+Date.now(), vendor:v.name, vendorId:v.id, teacherId:'T1001', classId, groupId,
    group, headcount,
    tool:v.product, status:'pending_it', expiresAt:'2026-08-05', origin:'teacher',
    declineReason:null, cooldownUntil:null, declinedBy:null,
  });
  renderMyRequests();
  toast('已送出試用請求：'+v.name+' · 14 天（Tier 1），待資訊科技統籌確認');
}

function submitRequest(groupId){
  const vendorId = document.getElementById('vendorPick-'+groupId).value;
  const v = VENDORS.find(x=>x.id===vendorId);
  let groupLbl, memberSnapshot, classId, overlap, successLabel;
  if(isStudyGroupScope(groupId)){
    const sgId = studyGroupIdFromScope(groupId);
    groupLbl = studyGroupLabel(sgId);
    memberSnapshot = studyGroupMembers(sgId).map(s=>s.n);
    classId = null; // deliberate — cross-class scope-overlap checking (which assumes
    // a single class) doesn't apply here; see vendor-data.js's scope-key comment.
    overlap = null;
    successLabel = STUDY_GROUPS.find(x=>x.id===sgId).name;
  } else {
    overlap = scopeOverlapNote(vendorId, activeClassId, groupId);
    memberSnapshot = groupId==='__whole_class__' ? wholeClassMembers(activeClassId).map(s=>s.n) : groupMembers(activeClassId, groupId).map(s=>s.n);
    classId = activeClassId;
    groupLbl = groupLabel(activeClassId, groupId);
    successLabel = groupId==='__whole_class__' ? '全班' : classGroups(activeClassId).find(g=>g.id===groupId).name;
  }
  const headcount = memberSnapshot.length;
  const reqId = 'gr-'+Date.now();
  v.pending.push({
    id:reqId, teacherId:'T1001', group:groupLbl, classId, groupId, memberSnapshot, headcount,
    src:'來自學生工具申請（group-access-requests.html）', status:'pending', _pickedTier:null,
    overlapNote: overlap,
  });
  renderMyRequests();
  renderSubmittedCard(groupId, v.name, successLabel, overlap);
  toast('已送出：'+successLabel+' 申請使用「'+v.name+'」，待資料存取審批');
}

/* Demo the actual next step instead of leaving 送出正式申請 as a dead-end toast:
 * the request just pushed into v.pending is the exact same shared array
 * eddata-console.html reads its 待審批 queue from (approve()/deny() there) — so
 * this in-place card swap tells the teacher who acts next and where, mirroring
 * the pattern already used for 科組試用評估 on subscriptions.html. Switching
 * class or re-rendering scope cards will reset this card's visual state, but
 * the underlying request itself is unaffected — it stays visible under 我的
 * 請求與狀態 and in 馮 Sir's queue either way. */
function renderSubmittedCard(groupId, vendorName, scopeLabel, overlap){
  const card = document.getElementById('scopeCard-'+groupId);
  if(!card) return;
  card.classList.add('submitted');
  const overlapHtml = overlap ? `<div class="overlap-note">⚠ ${overlap}</div>` : '';
  card.innerHTML = `
    <div class="sc-head"><b><svg class="ck" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.4 5.4 10.8 12 3.2"/></svg> ${scopeLabel}</b><span class="submit-chip">⏳ 待審批</span></div>
    <div class="goal" style="color:#0c6b48;">已送出「${vendorName}」的資料存取申請。</div>
    ${overlapHtml}
    <div class="submit-next">資訊科技統籌（馮 Sir）會在<a href="eddata-console.html">供應商資料存取控制台</a>審批這個請求——核准後，工具才會出現在相關學生的介面。這頁不會自動偵測審批結果，請到下方「我的請求與狀態」查看最新進度，或直接前往控制台查看審批隊列。</div>
    <button class="go" style="margin-top:10px;" onclick="showTab('mine')">查看我的請求 →</button>
  `;
}

function myRelevantEntries(){
  // grants + pending requests belonging to the active class AND made by ME —
  // classId alone isn't enough once more than one teacher can have a request
  // scoped to the same class (see MY_TEACHER_ID comment above). Study-group-
  // scoped entries (classId:null) are shown separately below, always,
  // regardless of which class is active, since they were never scoped to one.
  const out = [];
  VENDORS.forEach(v=>{
    v.grants.forEach(g=>{ if(g.classId===activeClassId && g.teacherId===MY_TEACHER_ID) out.push({v, entry:g, kind:'grant'}); });
    v.pending.forEach(p=>{ if(p.classId===activeClassId && p.teacherId===MY_TEACHER_ID) out.push({v, entry:p, kind:'pending'}); });
  });
  return out;
}

function myStudyGroupEntries(){
  const out = [];
  VENDORS.forEach(v=>{
    v.grants.forEach(g=>{ if(isStudyGroupScope(g.groupId) && g.teacherId===MY_TEACHER_ID) out.push({v, entry:g, kind:'grant'}); });
    v.pending.forEach(p=>{ if(isStudyGroupScope(p.groupId) && p.teacherId===MY_TEACHER_ID) out.push({v, entry:p, kind:'pending'}); });
  });
  return out;
}

function myRelevantTrials(){
  return TRIALS.filter(t=>t.classId===activeClassId && t.origin==='teacher' && t.teacherId===MY_TEACHER_ID);
}

function myStudyGroupTrials(){
  return TRIALS.filter(t=>isStudyGroupScope(t.groupId) && t.origin==='teacher' && t.teacherId===MY_TEACHER_ID);
}

const TRIAL_STATUS_CHIP = {
  pending_it:'<span class="rchip pending">⏳ 試用待確認</span>',
  active:'<span class="rchip approved"><svg class="ck" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.4 5.4 10.8 12 3.2"/></svg> 試用中</span>',
  declined:'<span class="rchip denied">✕ 試用被拒</span>',
  graduated:'<span class="rchip approved">🎓 已轉為正式申請</span>',
};

function renderGrantCard(v, entry, kind, driftCounter){
  // driftCounter is a {n:0} box rather than a return value, since callers need
  // to accumulate across two separate lists (class-scoped + study-group-scoped)
  const drift = membershipDrift(entry);
  if(drift) driftCounter.n++;
  const statusChip = kind==='grant' ? `<span class="rchip approved"><svg class="ck" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.4 5.4 10.8 12 3.2"/></svg> 已核准 · ${entry.tier}</span>`
    : entry.status==='pending' ? `<span class="rchip pending">⏳ 待審批</span>`
    : entry.status==='approved' ? `<span class="rchip approved"><svg class="ck" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.4 5.4 10.8 12 3.2"/></svg> 已核准 · ${entry.tier}</span>`
    : `<span class="rchip denied">✕ 已拒絕</span>`;
  const entryTeacherLabel = entry.teacherId ? teacherName(entry.teacherId)+' · ' : '';
  let driftHtml = '';
  if(drift){
    const parts = [];
    if(drift.added.length) parts.push('新增：'+drift.added.join('、'));
    if(drift.removed.length) parts.push('移除：'+drift.removed.join('、'));
    driftHtml = `<div class="drift-banner"><b>⚠ 分組成員已改變</b>自${kind==='grant'?'核准':'申請'}後，${parts.join('；')}。存取範圍維持原狀，不會自動調整；如需涵蓋新成員或縮減範圍，請重新提出請求或聯絡資訊科技統籌。</div>`;
  }
  const overlapHtml = entry.overlapNote ? `<div class="overlap-flag">⚠ ${entry.overlapNote}</div>` : '';
  return `<div class="req-card">
    <div class="rc-head">
      <div><b>${entryTeacherLabel}${entry.group}</b><small>${v.name} · ${v.product}</small></div>
      <div class="rc-badges">${statusChip}</div>
    </div>
    ${driftHtml}${overlapHtml}
  </div>`;
}

function renderTrialCard(t){
  const statusChip = TRIAL_STATUS_CHIP[t.status] || '';
  const expiryNote = t.status==='active' ? `<small style="display:block;margin-top:2px;">試用至 ${t.expiresAt}</small>` : '';
  return `<div class="req-card">
    <div class="rc-head">
      <div><b>🧪 ${t.group}</b><small>${t.vendor} · ${t.tool}</small>${expiryNote}</div>
      <div class="rc-badges">${statusChip}</div>
    </div>
  </div>`;
}

function renderMyRequests(){
  const items = myRelevantEntries();
  const trials = myRelevantTrials();
  const sgItems = myStudyGroupEntries();
  const sgTrials = myStudyGroupTrials();
  const driftCounter = {n:0};

  const trialCards = trials.map(t=>renderTrialCard(t));
  const grantCards = items.map(({v,entry,kind})=>renderGrantCard(v,entry,kind,driftCounter));
  const sgTrialCards = sgTrials.map(t=>renderTrialCard(t));
  const sgGrantCards = sgItems.map(({v,entry,kind})=>renderGrantCard(v,entry,kind,driftCounter));

  const classSection = [...trialCards, ...grantCards];
  const sgSection = [...sgTrialCards, ...sgGrantCards];

  let html = classSection.length ? classSection.join('') : `<div class="empty-msg">目前沒有與教學分組相關的請求或已核准存取</div>`;
  if(sgSection.length){
    html += `<h2 style="margin-top:26px;">跨班學習小組</h2>` + sgSection.join('');
  }
  document.getElementById('myRequestsList').innerHTML = html;

  const countEl = document.getElementById('driftCount');
  if(driftCounter.n>0){ countEl.style.display='inline-block'; countEl.textContent = driftCounter.n; }
  else { countEl.style.display='none'; }
}

function showTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('active', p.dataset.pane===name));
}

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1900);}
renderClassSwitcher();
renderScopeCards();
renderStudyGroupScopeCards();
renderMyRequests();
</script>
