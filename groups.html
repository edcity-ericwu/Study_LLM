<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdCity 教學分組 — 課堂層級</title>
<!-- Site-wide typeface: Chiron GoRound TC, a rounded Traditional Chinese sans
     built on Source Han Sans/Chiron Hei HK.

     Served from Google Fonts (Eric's call, 2026-08-21) rather than self-hosted
     and subsetted. The subset was built from the characters the prototype
     happened to contain, which cannot be right for a tool whose whole premise
     is a teacher pasting arbitrary 課文 — 岳 was missing the moment 岳陽樓記
     was added. Google's unicode-range delivery gives full coverage while the
     browser fetches only the ranges each page actually touches.

     display=block, not swap: swap paints the fallback first and Chiron has
     different metrics, so every nav row changed height on the swap. block has
     nothing to swap from.

     Trade-off recorded in the Decision Log: this sends each visitor's IP to
     Google, which a government-funded body may not be able to ship. Falls back
     to PingFang TC / Microsoft JhengHei / Noto Sans TC if it cannot load. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=block">
<style>
  :root{
    --ec-blue:#008BD1;--ec-blue-dark:#0072ab;--ec-red:#ED1A2E;--ec-green:#00AC6C;
    --ec-maroon:#7B2539;--ec-amber:#F5A623;--ec-purple:#7C5CDB;--ec-teal:#0f8c8c;
    --ink:#1e2a35;--ink-2:#55636f;--ink-3:#8a97a3;--line:#e6ebf0;--bg:#f1f2f8;font-size:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);display:flex;min-height:100vh;}
  .sidebar{width:248px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .sidebar .logo-wrap{padding:20px 16px 20px;border-bottom:1px solid var(--line);}
  .sidebar .logo-wrap img{width:100%;height:auto;display:block;}
  .sidebar .logo-sub{font-size:.8rem;font-weight:700;color:var(--ink-2);margin-top:16px;letter-spacing:normal;}
  .viewer-chip{display:inline-flex;align-items:center;gap:6px;font-size:.64rem;font-weight:700;color:var(--ec-blue-dark);background:#e6f4fb;border:1px solid #c4e5f5;border-radius:99px;padding:4px 10px;margin-top:14px;}
  .nav{padding:14px 10px;flex:1;overflow-y:auto;}
  /* Spacing between nav groups. This rule was missing on most pages, so the
   * Ideas Lab box sat 14px below the last link (its own margin-top) instead of
   * the 18px the two margins collapse to when it's present — the box visibly
   * hugged 校本教材庫 on those pages and not on chat/index/agents. */
  .nav-group{margin-bottom:18px;}
  .nav-group h6{font-size:.66rem;font-weight:600;color:var(--ec-blue);letter-spacing:normal;padding:0 10px 8px;text-transform:uppercase;}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-size:.85rem;margin-bottom:2px;}
  /* Ideas Lab — screens that are proposals, not built features. Grouped and
   * pill-tagged so the status is visible from the nav and from the page
   * headline, without having to open the page and read its ribbon. */
  .nav-group.ideas{background:#fbf7ef;border:1px solid #f0e4cf;border-radius:12px;padding:10px 4px 8px;margin-top:14px;}
  /* The nav no longer carries a per-link "Ideas Lab" pill — the group heading
   * above already says it, so the pill was pure repetition, and it was the pill
   * rather than the label that made the 248px sidebar tight. nowrap is kept so
   * a long label still can't reflow onto a second line. */
  .nav a{white-space:nowrap;}
  /* Hover/active inside the Ideas Lab box use the box's own amber family —
   * the default blue tints read as a different system sitting inside a warm
   * container. (The bronze nav pill this once had to coexist with is gone.) */
  .nav-group.ideas a:hover{background:#f4e9d6;}
  .nav-group.ideas a.active{background:#ecdcbe;color:#7a4f08;font-weight:600;}
  /* Flask marks the Ideas Lab section: these pages are experiments, not built
   * features. Sized to the text it sits beside rather than to the nav icons —
   * it labels the group, it isn't a nav item of its own. */
  .nav-group.ideas h6{display:flex;align-items:center;gap:6px;color:#8a5a09;}
  .lab-ic{width:1.05em;height:1.05em;flex-shrink:0;}
  .nav a:hover{background:#f2f6f9;}
  .nav a.active{background:#e6f4fb;color:var(--ec-blue-dark);font-weight:600;}
  .nav a .ic{width:17px;height:17px;flex-shrink:0;}
  .sidebar .user{border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .sidebar .user .avatar{width:34px;height:34px;border-radius:50%;background:var(--ec-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;}
  .sidebar .user .meta b{font-size:.8rem;display:block;}
  .sidebar .user .meta span{font-size:.68rem;color:var(--ink-3);}

  .main{flex:1;min-width:0;padding:44px 34px 80px;}
  .ribbon{display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:700;color:#8a6d00;background:#fdf1c7;border:1px solid #f0dfa0;border-radius:99px;padding:5px 14px;margin-bottom:16px;}
  /* The class chip must stay top-right. flex-wrap dropped it below the
   * paragraph as soon as the viewport narrowed, so the same control appeared
   * in two different places depending on the screen. The text column shrinks
   * instead — .ph-text has no min-width, so it yields before the chip moves. */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .page-head .ph-text{flex:1;min-width:0;}
  .page-head .class-dd{flex-shrink:0;}
  .hero{margin-bottom:24px;border-bottom:1px solid var(--line);}
  h1{font-size:1.8rem;font-weight:800;color:var(--ec-blue);margin-bottom:16px;}
  .sub{font-size:.9rem;color:var(--ink-2);margin:6px 0 32px;max-width:52em;line-height:1.6;}
  .class-dd{position:relative;}
  .class-btn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:.82rem;cursor:pointer;font-family:inherit;color:var(--ink);}
  .class-btn b{color:var(--ec-blue-dark);}
  .class-btn .car{font-size:.7rem;color:var(--ink-3);margin-left:2px;}
  .class-menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,30,40,.14);width:250px;padding:6px;display:none;z-index:40;}
  .class-menu.show{display:block;}
  .class-opt{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:.8rem;color:var(--ink-2);}
  .class-opt:hover{background:#f2f6f9;}
  .class-opt.on{background:#e6f4fb;color:var(--ec-blue-dark);font-weight:600;}
  .class-opt small{font-size:.68rem;color:var(--ink-3);font-weight:400;}

  .ownership{
    margin:14px 0 20px;background:#effaf5;border:1px solid #bfe8d7;border-radius:12px;
    padding:11px 15px;font-size:.76rem;color:#0c6b48;line-height:1.65;max-width:52em;
  }

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .btn{border:none;border-radius:10px;padding:9px 16px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;background:var(--ec-blue);color:#fff;transition:background .15s ease;}
  .btn:not(.ghost):hover{background:var(--ec-blue-dark);}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:600;}
  .hint-move{font-size:.7rem;color:var(--ink-3);}

  .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start;}
  /* Whole-class scope. A real scope, not a group that happens to hold everyone
   * — some tools are for the whole class by nature (a reading library), and
   * pretending otherwise would make a teacher keep a 全班 group in sync by hand. */
  .allclass{background:#fff;border:1px solid var(--line);border-left:3px solid var(--ec-blue);border-radius:14px;padding:14px 17px;margin-bottom:18px;}
  .allclass .ac-head{display:flex;align-items:center;gap:9px;margin-bottom:3px;}
  .allclass .ac-head b{font-size:.88rem;}
  .allclass .ac-head .n{font-size:.7rem;color:var(--ink-3);}
  .allclass .ac-goal{font-size:.7rem;color:var(--ink-3);margin-bottom:9px;}
  .allclass .ac-head .dot{width:9px;height:9px;border-radius:50%;background:var(--ec-blue);flex-shrink:0;}
  .allclass .ac-head b a{color:inherit;text-decoration:none;}
  .allclass .ac-head b a:hover{color:var(--ec-blue-dark);text-decoration:underline;}
  /* Opening a scope is the board's one action, so it gets a real button on every
   * card rather than a 12px arrow. 全班 takes the solid variant because there is
   * exactly one of it; three solid buttons in the group row would shout. */
  .openbtn{display:block;text-align:center;margin-top:12px;border:1px solid var(--line);border-radius:9px;
    padding:9px;font-size:.76rem;font-weight:600;color:var(--ec-blue-dark);text-decoration:none;background:#fff;}
  .openbtn:hover{border-color:var(--ec-blue);background:#f7fbfe;}
  .openbtn.solid{background:var(--ec-blue);border-color:var(--ec-blue);color:#fff;max-width:240px;}
  .openbtn.solid:hover{background:var(--ec-blue-dark);border-color:var(--ec-blue-dark);}
  .sm{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.7rem;}
  .sm span{border-radius:99px;padding:3px 10px;}
  .sm .sm-on{background:#effaf5;border:1px solid #bfe8d7;color:#0c6b48;}
  .sm .sm-wait{background:#fdf6e3;border:1px solid #efdcb0;color:#8a5a09;}
  .sm .sm-budget{background:#f3f0fb;border:1px solid #d8cff0;color:#4a3b7a;}
  .more-row{font-size:.7rem;color:var(--ink-3);text-align:center;padding:6px 0 2px;}
  .col{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;}
  .col .c-head .open{margin-left:6px;color:var(--ink-3);text-decoration:none;font-size:.78rem;}
  .col .c-head .open:hover{color:var(--ec-blue-dark);}
  .col .c-head b a{color:inherit;text-decoration:none;}
  .col .c-head b a:hover{color:var(--ec-blue-dark);text-decoration:underline;}
  .col .c-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .col .c-head .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .col .c-head b{font-size:.85rem;}
  .col .c-head .n{margin-left:auto;font-size:.68rem;color:var(--ink-3);}
  .col .c-goal{font-size:.68rem;color:var(--ink-3);margin-bottom:10px;line-height:1.5;}
  .stu{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;
    padding:7px 10px;font-size:.78rem;margin-bottom:6px;background:#fafcfd;
  }
  .stu[draggable=true]{cursor:grab;}
  .stu[draggable=true]:hover{border-color:var(--ec-blue);}
  .stu.dragging{opacity:.4;}
  .col.dragover{border-color:var(--ec-blue);box-shadow:0 0 0 2px #c4e5f5;background:#f7fbfe;}
  .stu .av{width:22px;height:22px;border-radius:50%;background:#e6f4fb;color:var(--ec-blue-dark);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0;}
  .stu .no{color:var(--ink-3);font-size:.68rem;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .stu.left{opacity:.45;text-decoration:line-through;cursor:default;}
  .board-search{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:.78rem;font-family:inherit;min-width:200px;}
  .col .stu-empty{font-size:.72rem;color:var(--ink-3);padding:10px 0;text-align:center;}
  /* Confirmation strip once a group actually has material assigned — a
   * separate, persistent line above the button, not just a toast that
   * disappears — so re-opening this page later still shows what's assigned,
   * same "don't hide the current state behind a transient toast" fix already
   * applied elsewhere in this suite (subscriptions.html's request flows). */

  .sync{
    margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px;
    display:flex;gap:12px;align-items:flex-start;font-size:.78rem;color:var(--ink-2);line-height:1.65;
  }
  .sync .ic{font-size:1.1rem;flex-shrink:0;}
  .sync b{color:var(--ink);}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.78rem;padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:120;}
  .toast.show{opacity:.94;}
  footer.note{margin-top:40px;font-size:.68rem;color:var(--ink-3);text-align:center;}
  @media (max-width:900px){.sidebar{display:none;}.main{padding:18px;}}
  /* Portal switcher */
  .portal-sw{position:relative;padding:12px 12px 0;}
  .ps-btn{width:100%;display:flex;align-items:center;gap:9px;background:#f7fafc;border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;cursor:pointer;font-family:inherit;text-align:left;}
  .ps-btn:hover{border-color:var(--ec-blue);}
  .ps-ic{font-size:1rem;flex-shrink:0;}
  .ps-txt{flex:1;min-width:0;}
  .ps-txt small{display:block;font-size:.6rem;color:var(--ink-3);letter-spacing:.04em;}
  .ps-txt b{display:block;font-size:.82rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ps-car{font-size:.62rem;color:var(--ink-3);flex-shrink:0;}
  .portal-menu{position:absolute;top:calc(100% + 4px);left:12px;right:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 30px rgba(20,30,40,.16);padding:6px;display:none;z-index:60;}
  .portal-menu.show{display:block;}
  .portal-menu a{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:9px;
    text-decoration:none;color:var(--ink-2);}
  .portal-menu a:hover{background:#f2f6f9;}
  .portal-menu a.on{background:#e6f4fb;}
  .portal-menu .pm-ic{font-size:.95rem;}
  .portal-menu b{display:block;font-size:.8rem;color:var(--ink);}
  .portal-menu small{display:block;font-size:.66rem;color:var(--ink-3);line-height:1.45;margin-top:1px;}
</style>
<!-- Loaded in <head>, not at the end of <body>: it injects the rules that
     hide feature-flagged elements, and those must exist before first paint
     or the flagged nav row and the 提案中 ribbons flash in and out. -->
<script src="feature-flags.js"></script>
<!-- Collapsible sidebar. In <head> for the same reason as feature-flags.js:
     the stored collapsed state must be on <html> before first paint, or the
     sidebar renders full-width and then disappears on every navigation. -->
<link rel="stylesheet" href="shell-chrome.css">
<script src="shell-chrome.js"></script>
</head>
<body>

<aside class="sidebar">
  <div class="logo-wrap">
    <img src="edcity_logo.svg" alt="香港教育城 EdCity">
    <div class="logo-sub">教學工具平台 · POC v0.1</div>
    <div class="viewer-chip">🧑‍🏫 課堂層級 · 教師視圖</div>
  </div>
  <!-- Portal switcher. The teacher's screens do two different jobs — making

  <div class="portal-sw">

      <span class="ps-ic">🏫</span>
      <span class="ps-txt"><small>目前身處</small><b>課堂與學生</b></span>
      <span class="ps-car">▾</span>
    </button>
    <div class="portal-menu" id="portalMenu">
      <a href="chat.html" class=""><span class="pm-ic">✨</span><span><b>EdCity.ai</b><small>科目助理、工具箱、批改、教材</small></span></a>
      <a href="groups.html" class="on"><span class="pm-ic">🏫</span><span><b>課堂與學生</b><small>分組、工具申請、試用邀請</small></span></a>
    </div>
  </div>
  <nav class="nav">
    <div class="nav-group">
      <h6>課堂與學生</h6>
      <a href="groups.html" class="active"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>教學分組</a>
      <a href="tool-status.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>工具申請進度</a>
      <a href="trial-invites.html" data-feature="vendorInitiatedTrial"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11l-3 3-2-2"/></svg>試用邀請</a>
    </div>
    <div class="nav-group ideas">
      <h6><svg class="lab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.5L4.6 18a2 2 0 0 0 1.7 3h11.4a2 2 0 0 0 1.7-3L14 9.5V3"/><path d="M7.2 14h9.6"/></svg>Ideas Lab</h6>
      <a href="insights.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 14l4-4 4 4 5-6"/></svg>學習紀錄庫</a>
    </div>
  </nav>
  <div class="user">
    <div class="avatar">陳</div>
    <div class="meta"><b>陳凱怡老師</b><span>中文科</span></div>
  </div>
</aside>

<main class="main">
  <section class="hero">
    <div class="ribbon">🟡 提案中 · 此畫面為設計方案，功能未建置</div>

    <div class="page-head">
      <div class="ph-text">
        <h1>教學分組</h1>
        <div class="sub">把班級分成小組，總覽每組已指派的教材與工具。開啟任何一組或全班，即可指派。名單直接取自學校帳戶管理系統，毋須重新輸入。</div>

<script src="vendor-data.js"></script>
<script>
/* GROUPS/students used to live only here; they're now CLASSES[classId].groups/.students
 * in vendor-data.js, shared with trial-invites.html and
 * eddata-console.html so a tool request always compares against the same membership
 * this board shows. A teacher can teach more than one class (same subject) — see
 * activeClassId below — so every lookup is keyed by class, not just group. */
/* The logged-in teacher for this page — same persona as the sidebar badge
 * (陳凱怡老師). Used to scope the class switcher: it used to list every class
 * in CLASS_LIST regardless of who teaches it, so 陳凱怡 could switch to 中一甲班
 * even though that's 黃穎詩's class, not hers — same category of bug just
 * fixed in the since-deleted 學生工具申請 page, here applied to which
 * classes appear at all rather than which requests appear. */
const MY_TEACHER_ID = 'T1001';
let activeClassId = '2b';

function myClasses(){ return CLASS_LIST.filter(cl=>cl.teacherId===MY_TEACHER_ID); }

function renderClassSwitcher(){
  const c = CLASSES[activeClassId];
  document.getElementById('classLabel').textContent = c.className;
  /* Live count, not the seeded one. The label used to carry a static 35 人 while
   * the 全班 card computed 34 from the roster (one student had transferred out) —
   * two numbers for the same class on one screen. */
  const active = (c.students||[]).filter(s=>!s.left).length;
  document.getElementById('classMeta').textContent = `· ${c.subjectLabel} · ${active} 人`;
  document.getElementById('classMenu').innerHTML = myClasses().map(cl=>
    `<div class="class-opt ${cl.id===activeClassId?'on':''}" data-c="${cl.id}" onclick="switchClass('${cl.id}')">${cl.className}<small>${cl.subjectLabel}</small></div>`
  ).join('');
}
function toggleClassMenu(){ document.getElementById('classMenu').classList.toggle('show'); }
function switchClass(classId){
  activeClassId = classId;
  document.getElementById('classMenu').classList.remove('show');
  boardSearch = '';
  document.getElementById('boardSearchInput').value = '';
  renderClassSwitcher();
  render();
  toast('已切換至 '+CLASSES[classId].className);
}
document.addEventListener('click', e=>{ if(!e.target.closest('.class-dd')) document.getElementById('classMenu').classList.remove('show'); });

/* Search added 2026-07-27: classes are now ~35 students, split across 3
 * columns (e.g. 核心組 alone can hold 19+) — scanning a flat list to find one
 * student, or to safely drag the right one, is exactly the mistake-prone
 * scenario Eric flagged. Search narrows each column to matching students by
 * name or 班號 (class seat number, shown on every row so a name collision
 * like 陳嘉欣 is never the only way to tell students apart); sorting by 班號
 * keeps each column in the same order the teacher already uses for a seating
 * chart / attendance list, rather than raw insertion order. The header count
 * always reflects the FULL group membership, not the filtered view, so
 * narrowing the list to search never reads as the group having changed. */
let boardSearch = '';
function onBoardSearch(input){
  boardSearch = input.value;
  render();
}


function renderAllClass(){
  const c = CLASSES[activeClassId];
  const n = (c.students||[]).filter(s=>!s.left).length;
  const href = `group-detail.html?c=${activeClassId}&g=__whole_class__`;
  document.getElementById('allClass').innerHTML = `
    <div class="ac-head"><span class="dot"></span><b><a href="${href}">全班</a></b><span class="n">· ${n} 人</span></div>
    <div class="ac-goal">整班一起使用的教材與工具，例如分級閱讀庫。指派給全班，不必逐組重複；下方各組是這個班的細分。</div>
    ${attachSummary(activeClassId,'__whole_class__')}
    <a class="openbtn solid" href="${href}">開啟全班 →</a>`;
}

/* Read-only. Assignment lives in the group container — one surface, one code
 * path. Keeping a second assign menu on the card meant two places to change a
 * scope and a card that grew every time a group gained an attachment. */
/* The board's primary create action used to raise a toast saying 建立新分組 and
 * create nothing — the one thing this page exists to let her do. */
const GROUP_COLORS = ['var(--ec-purple)','var(--ec-blue)','var(--ec-green)','var(--ec-teal)','var(--ec-amber)'];
function newGroup(){
  const c = CLASSES[activeClassId];
  const name = (prompt('新分組的名稱？', '') || '').trim();
  if(!name) return;
  if(c.groups.some(g=>g.name===name)){ toast('已有同名分組'); return; }
  const goal = (prompt('這一組的目的？（可留空）', '') || '').trim();
  c.groups.push({
    id:'g'+Date.now(), name, goal: goal || '（未填寫目的）',
    color: GROUP_COLORS[c.groups.length % GROUP_COLORS.length],
  });
  render();
  toast(`已建立「${name}」，把學生拖進去即可`);
}

function attachSummary(classId, groupId){
  const list = (typeof toolsForGroup === 'function') ? toolsForGroup(classId, groupId) : [];
  const active = list.filter(t=>t.status==='active').length;
  const pending = list.filter(t=>t.status==='pending').length;
  const budget = (typeof BUDGET_PENDING !== 'undefined' ? BUDGET_PENDING : [])
    .filter(b=>b.classId===classId && b.groupId===groupId).length;
  const bits = [];
  if(active) bits.push(`<span class="sm-on">🧩 ${active} 項工具</span>`);
  if(pending) bits.push(`<span class="sm-wait">⏳ ${pending} 項待審批</span>`);
  if(budget) bits.push(`<span class="sm-budget">📋 ${budget} 項待預算</span>`);
  /* No chip when there is nothing assigned. The empty state was the board's most
   * common state, so a grey negative on most cards was the dominant visual. */
  if(!bits.length) return '';
  return `<div class="sm">${bits.join('')}</div>`;
}

function render(){
  renderAllClass();
  const c = CLASSES[activeClassId];
  const q = boardSearch.trim();
  document.getElementById('board').innerHTML = c.groups.map((grp)=>{
    const members = c.students.filter(s=>s.g===grp.id);
    const active = members.filter(s=>!s.left).length;
    let visible = members;
    if(q) visible = visible.filter(s=>s.n.includes(q) || String(s.no).includes(q) || (/^\d+$/.test(q) && s.no===parseInt(q,10)));
    visible = visible.slice().sort((a,b)=>(a.no||0)-(b.no||0));
    /* Long columns (核心組 can hold 20 against 8 and 7) ran far past their
     * neighbours. The full list is one click away in the group view now. */
    const CAP = 10;
    /* Only truncate when it actually saves space — hiding one or two students
     * behind 「還有 N 位」 costs a row and gains nothing. */
    const overflow = (q || visible.length <= CAP + 2) ? 0 : visible.length - CAP;
    if(overflow) visible = visible.slice(0, CAP);
    const rowsHtml = visible.map(s=>`<div class="stu ${s.left?'left':''}" ${s.left?'':'draggable="true" ondragstart="dragStu(event,\''+s.n+'\')" ondragend="this.classList.remove(\'dragging\')"'}>
        <span class="av">${s.n[0]}</span><span class="no">${s.no!=null?String(s.no).padStart(2,'0'):''}</span>${s.n}${s.left?'（已轉班 · 自動退出）':''}
      </div>`).join('');
    return `<div class="col" data-gi="${grp.id}" ondragover="dragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="dropStu(event,'${grp.id}')">
      <div class="c-head"><span class="dot" style="background:${grp.color}"></span><b><a href="group-detail.html?c=${activeClassId}&g=${grp.id}">${grp.name}</a></b><span class="n">${active} 人</span></div>
      <div class="c-goal">${grp.goal}</div>
      ${visible.length ? rowsHtml : (q ? '<div class="stu-empty">沒有符合的學生</div>' : '')}
      ${overflow ? `<div class="more-row">還有 ${overflow} 位</div>` : ''}
      ${attachSummary(activeClassId, grp.id)}
      <a class="openbtn" href="group-detail.html?c=${activeClassId}&g=${grp.id}">開啟分組 →</a>
    </div>`;
  }).join('');
}
let dragName=null;
function dragStu(ev,name){
  dragName=name;
  ev.dataTransfer.setData('text/plain',name);
  ev.dataTransfer.effectAllowed='move';
  ev.target.classList.add('dragging');
}
function dragOver(ev){
  ev.preventDefault();
  ev.dataTransfer.dropEffect='move';
  ev.currentTarget.classList.add('dragover');
}
/* How many of this group's students can actually use each granted tool.
 * Read-only and non-blocking: it makes a gap between grouping and tool access
 * visible without creating pending state or acting on her behalf. */

function dropStu(ev,gid){
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  const name=ev.dataTransfer.getData('text/plain')||dragName;
  if(!name) return;
  const c = CLASSES[activeClassId];
  const s=c.students.find(x=>x.n===name);
  if(!s||s.left||s.g===gid) return;
  s.g=gid;
  // Superseded 2026-08-18: tool access is no longer a separate curated list, so
  // this move does change what the vendor sees — within 課室, which is what was
  // approved.
  recordGroupOverride(s.sid, gid);
  /* Release follows membership now, so the vendor payload has to be republished
   * here. This does NOT spend anything: seats meter at first EdConnect sign-in,
   * and both groups sit inside the same 課室, so nothing crosses the bound. */
  if(typeof publishReleases === 'function') publishReleases();
  render();
  const grp = c.groups.find(g=>g.id===gid);
  toast(name+' → '+grp.name);
  dragName=null;
}
/* moveStu() (click-a-row-to-cycle-to-the-next-group) removed 2026-07-27 per
 * Eric: with columns this large, a plain click silently moving a student to
 * whatever group happens to be "next" (not a chosen destination) was causing
 * real mistakes. Drag-and-drop remains the only way to move a student between
 * groups, since it requires picking the actual destination column. */

/* A tool assignment IS the data-release request — same gesture as assigning a
 * worksheet. She never visits a request page, never enumerates students, never
 * sees a seat count. The bound is 課室 (this class, from 任教編配), so everyone
 * in the group is inside it by construction and there is nothing to reconcile.
 * 馮 Sir approves; until then the row reads 審批中 rather than blocking her. */
function toolsForGroup(classId, groupId){
  if(typeof VENDORS === 'undefined') return [];
  const out = [];
  VENDORS.forEach(v=>{
    (v.grants||[]).forEach(g=>{
      if(g.classId===classId && g.groupId===groupId) out.push({vendor:v, status:'active', since:g.since});
    });
    (v.pending||[]).forEach(p=>{
      if(p.status && p.status!=='pending' && p.status!=='queued') return;
      if(p.classId===classId && p.groupId===groupId && p.teacherId===MY_TEACHER_ID) out.push({vendor:v, status:'pending'});
    });
  });
  return out;
}
/* Unapproved tools are offered, not hidden and not greyed out. Discovery is the
 * point of the platform; approval is latency, not a wall. */

let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500);}
renderClassSwitcher();
render();
</script>

/* Sidebar-local; no dependency on demo-nav.js. */
function togglePortal(){ document.getElementById('portalMenu').classList.toggle('show'); }
document.addEventListener('click', e=>{
  if(!e.target.closest('.portal-sw')) document.getElementById('portalMenu')?.classList.remove('show');
});
</script>
