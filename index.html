<!-- Site-wide typeface (2026-07-31): Chiron GoRound TC, a rounded
     Traditional Chinese sans built on Source Han Sans/Chiron Hei HK,
     replacing the plain system-font stack. Falls back to the previous
     stack (PingFang TC / Microsoft JhengHei / Noto Sans TC / system) if
     the network font fails to load. -->
<link rel="preload" href="fonts/chiron-goround-tc-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/chiron-goround-tc-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/chiron-goround-tc-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/chiron-goround-tc-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/chiron-goround-tc-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --ec-blue:#008BD1;
    --ec-blue-dark:#0072ab;
    --ec-red:#ED1A2E;
    --ec-green:#00AC6C;
    --ec-maroon:#7B2539;
    --ec-amber:#F5A623;
    --ec-purple:#7C5CDB;
    --ink:#1e2a35;
    --ink-2:#55636f;
    --ink-3:#8a97a3;
    --line:#e6ebf0;
    --bg:#f1f2f8;
    --card:#ffffff;
    --radius:14px;
    font-size:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;min-height:100vh;
  }

  /* ─── Sidebar ─── */
  .sidebar{
    width:248px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .sidebar .logo-wrap{padding:20px 16px 20px;border-bottom:1px solid var(--line);}
  .sidebar .logo-wrap img{width:100%;height:auto;display:block;}
  .sidebar .logo-sub{font-size:.8rem;font-weight:700;color:var(--ink-2);margin-top:16px;letter-spacing:normal;}
  .nav{padding:14px 10px;flex:1;overflow-y:auto;}
  .nav-group{margin-bottom:18px;}
  .nav-group h6{
    font-size:.66rem;font-weight:600;color:var(--ec-blue);letter-spacing:normal;
    padding:0 10px 8px;text-transform:uppercase;
  }
  .nav a{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
    color:var(--ink-2);text-decoration:none;font-size:.85rem;margin-bottom:2px;
  }
  /* Ideas Lab — screens that are proposals, not built features. Grouped and
   * pill-tagged so the status is visible from the nav and from the page
   * headline, without having to open the page and read its ribbon. */
  .nav-group.ideas{background:#fbf7ef;border:1px solid #f0e4cf;border-radius:12px;padding:10px 4px 8px;margin-top:14px;}
  /* The nav no longer carries a per-link "Ideas Lab" pill — the group heading
   * above already says it, so the pill was pure repetition, and it was the pill
   * rather than the label that made the 248px sidebar tight. nowrap is kept so
   * a long label still can't reflow onto a second line. */
  .nav a{white-space:nowrap;}
  /* Hover/active inside the Ideas Lab box use the box's own amber family —
   * the default blue tints read as a different system sitting inside a warm
   * container. (The bronze nav pill this once had to coexist with is gone.) */
  .nav-group.ideas a:hover{background:#f4e9d6;}
  .nav-group.ideas a.active{background:#ecdcbe;color:#7a4f08;font-weight:600;}
  /* Flask marks the Ideas Lab section: these pages are experiments, not built
   * features. Sized to the text it sits beside rather than to the nav icons —
   * it labels the group, it isn't a nav item of its own. */
  .nav-group.ideas h6{display:flex;align-items:center;gap:6px;color:#8a5a09;}
  .lab-ic{width:1.05em;height:1.05em;flex-shrink:0;}
  .nav a:hover{background:#f2f6f9;}
  .nav a.active{background:#e6f4fb;color:var(--ec-blue-dark);font-weight:600;}
  .nav a .ic{width:17px;height:17px;flex-shrink:0;}
  .sidebar .user{
    border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;
  }
  .sidebar .user .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--ec-blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;
  }
  .sidebar .user .meta{line-height:1.25;}
  .sidebar .user .meta b{font-size:.8rem;display:block;}
  .sidebar .user .meta span{font-size:.68rem;color:var(--ink-3);}

  /* ─── Main ─── */
  .main{flex:1;min-width:0;padding:50px 34px 60px;}

  .hero{
    margin-bottom:28px;border-bottom:1px solid var(--line);position:relative;
  }
  .hero .eyebrow{
    font-size:.7rem;letter-spacing:normal;color:var(--ec-blue-dark);font-weight:600;margin-bottom:12px;
  }
  h1{font-size:1.8rem;font-weight:800;color:var(--ec-blue);margin-bottom:16px;}
  h1 em{font-style:normal;}
  .sub{font-size:.9rem;color:var(--ink-2);margin:6px 0 32px;max-width:52em;line-height:1.6;}
  /* Standard page header — one shape suite-wide:
   *   .hero > .ribbon? + .page-head > .ph-text > (h1 + .sub) + action? + pill-row?
   * .page-head is the flex row that lets a page action (upload button, class
   * picker) sit opposite the title; .ph-text is the text column, so an action
   * can never squeeze the description. Adding a header element later is the
   * same edit on every page. */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-head .ph-text{flex:1;min-width:280px;}
  .hero .guide-btn{
    position:absolute;top:28px;right:30px;background:#fff;border:1px solid var(--line);
    border-radius:99px;padding:8px 16px;font-size:.8rem;color:var(--ink-2);cursor:pointer;
  }
  .hero .guide-btn:hover{border-color:var(--ec-blue);color:var(--ec-blue-dark);}

  /* ─── Search + toggle row ─── */
  .controls{display:flex;gap:14px;align-items:center;margin:0 0 6px;flex-wrap:wrap;}
  .search{
    flex:1;min-width:260px;display:flex;align-items:center;background:#fff;
    border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 18px;
  }
  .search input{
    flex:1;border:none;outline:none;font-size:.88rem;background:transparent;color:var(--ink);
    font-family:inherit;
  }
  .search button{
    background:var(--ec-blue);color:#fff;border:none;border-radius:99px;
    padding:9px 22px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s ease;}
  .search button:hover{background:var(--ec-blue-dark);}
  /* Segmented toggle — two views of the same thing, not a filter row, so it
   * keeps its enclosing track and stays distinct from .pill / .pill-sm.
   * Hover tints the inactive segment only; a border on hover would break
   * the seamless track, which is why this control had no hover until now.
   * Active fill stays page-specific (blue here, green on student.html). */
  .seg-toggle{
    display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px;
  }
  .seg-toggle button{
    border:none;background:transparent;border-radius:99px;padding:8px 20px;
    font-size:.82rem;color:var(--ink-2);cursor:pointer;font-family:inherit;font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .seg-toggle button:not(.on):hover{background:#f2f6f9;color:var(--ec-blue-dark);}
  .seg-toggle button.on{background:var(--ec-blue);color:#fff;font-weight:600;}

  /* ─── Category tabs ─── */
  .tabs-row{
    display:flex;align-items:center;gap:8px;margin:22px 0 4px;flex-wrap:wrap;
    padding-bottom:16px;border-bottom:1px dashed var(--line);
  }
  /* Neutral, not an accent colour — these row labels ("你的工具箱", "科目")
   * only name the filter beside them; colouring them implied a category
   * meaning that doesn't exist. */
  .row-label{font-size:.68rem;letter-spacing:normal;color:var(--ink-2);font-weight:600;margin-right:6px;}
  /* Filter pills, two sizes only.
   *   .pill    — the page's primary axis (科目 on index, 來源 on agents)
   *   .pill-sm — anything that filters within it (category, visibility, source)
   * Same white → blue-fill-when-active treatment for both; the size difference
   * is what makes the hierarchy readable. Replaces .tab/.subj/.src/.vis-btn/.fchip,
   * which were five names for two things at five slightly different sizes. */
  .pill-sm{
    display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:99px;padding:7px 15px;font-size:.78rem;color:var(--ink-2);cursor:pointer;
    font-family:inherit;transition:border-color .15s ease;
  }
  .pill-sm:not(.on):hover{border-color:var(--ec-blue);}
  .pill-sm.on{background:var(--ec-blue);border-color:var(--ec-blue);color:#fff;font-weight:600;}

  .result-count{font-size:.75rem;color:var(--ink-3);margin:14px 2px 12px;}

  /* Recommended tools aren't a separate section — they're sorted first
   * within the normal grid (see applyFilters()) and just wear this small
   * inline tag next to their name, same row as the isNew badge. */
  .rec-tag{
    font-size:.6rem;font-weight:700;color:#8a5a09;background:#fdf6ec;
    border:1px solid #f3e3c3;padding:2px 8px;border-radius:99px;letter-spacing:normal;
  }

  /* ─── Subject row (inside hero) ─── */
  /* Primary filter row — the page's top-level axis (科目 here, 來源 on agents).
   * margin-top is 0 on purpose: the description above sits inside .page-head,
   * and because .ph-text is a flex item its 32px bottom margin cannot collapse
   * out — so that 32px already sets the gap. Any margin here would stack on it. */
  .pill-row{display:flex;align-items:center;gap:8px;margin:0 0 32px;flex-wrap:wrap;}
  .pill{
    display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:99px;padding:8px 18px;font-size:.83rem;color:var(--ink-2);cursor:pointer;
    font-family:inherit;font-weight:500;transition:border-color .15s ease;
  }
  .pill:not(.on):hover{border-color:var(--ec-blue);}
  .pill.on{background:var(--ec-blue);border-color:var(--ec-blue);color:#fff;font-weight:600;}
  .pill .soon{
    font-size:.58rem;font-weight:700;color:var(--ec-amber);background:#fdf6ec;
    border:1px solid #f3e3c3;border-radius:99px;padding:2px 7px;letter-spacing:normal;
  }
  .pill.on .soon{color:#fff;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);}
  .coming-soon{
    display:none;padding:70px 0;text-align:center;
  }
  .coming-soon .cs-icon{font-size:2.4rem;margin-bottom:14px;}
  .coming-soon h3{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
  .coming-soon p{font-size:.82rem;color:var(--ink-2);max-width:30em;margin:0 auto;line-height:1.7;}

  /* ─── Grid + cards ─── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 18px 22px;position:relative;cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card::before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:99px;
    background:var(--accent,var(--ec-blue));
  }
  /* Travelling border highlight on hover. --angle must be registered via
   * @property or the browser can't interpolate it and the conic gradient
   * would jump rather than rotate. The ::after holds a conic gradient with
   * one bright arc; the two stacked masks knock out everything but a 1px
   * ring at the edge, so only that ring paints and the arc appears to run
   * around the card. (::before is already taken by the left accent bar.) */
  @property --angle{syntax:'<angle>';initial-value:0deg;inherits:false;}
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:conic-gradient(from var(--angle),
      transparent 0deg, transparent 200deg,
      rgba(0,139,209,.55) 250deg, #4fb8e8 285deg, var(--ec-blue) 300deg,
      rgba(0,139,209,.55) 330deg, transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .card:hover{transform:translateY(-3px);border-color:#c4e5f5;box-shadow:0 10px 26px rgba(0,139,209,.16);}
  .card:hover::after{opacity:1;animation:border-trace 2.4s linear infinite;}
  @keyframes border-trace{to{--angle:360deg;}}
  @media (prefers-reduced-motion:reduce){
    .card:hover::after{animation:none;}
    .card:hover{border-color:var(--ec-blue);}
  }
  /* The level badge used to be position:absolute in the card's top-right,
   * which took it out of flow — a long title (or a title plus the 推薦 tag)
   * had no idea it was there and ran underneath it. It now sits as the
   * third flex child of .top, so the title column is measured against it
   * and simply wraps earlier instead of colliding. min-width:0 on the
   * title column is what actually lets it shrink; without it a flex item
   * refuses to go below its content's intrinsic width. */
  .card .top{display:flex;align-items:flex-start;gap:12px;}
  .card .top .ttl{flex:1;min-width:0;}
  /* The tag cluster sits on the SAME ROW as the Chinese title, not beside
   * the whole title column — otherwise it reserves width from every line
   * under it too, and the English name wrapped early despite having plenty
   * of room. Scoping it to .hd means only the title competes with the
   * tags; .en below spans the full column. */
  .card .top .hd{display:flex;align-items:flex-start;gap:8px;}
  .card .top .hd h3{flex:1;min-width:0;}
  .card .top .badges{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-top:1px;}
  .card .tile{
    width:42px;height:42px;border-radius:11px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--accent,var(--ec-blue)) 12%, white);
    color:var(--accent,var(--ec-blue));
  }
  .card .tile svg{width:21px;height:21px;}
  .card h3{font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card .en{font-size:.68rem;color:var(--ink-3);font-weight:500;display:block;margin-top:2px;}
  .card p{font-size:.8rem;color:var(--ink-2);margin-top:10px;line-height:1.55;}
  .badge-new{
    font-size:.58rem;font-weight:700;color:#fff;background:var(--ec-purple);
    padding:2px 7px;border-radius:99px;letter-spacing:.06em;
  }
  .badge-level{
    flex-shrink:0;margin-top:2px;font-size:.62rem;font-weight:600;white-space:nowrap;
    color:var(--ink-3);background:var(--bg);border:1px solid var(--line);
    padding:3px 8px;border-radius:99px;
  }
  .badge-level.p-only{color:var(--ec-green);border-color:#bfe8d7;background:#effaf5;}
  .badge-level.s-only{color:var(--ec-maroon);border-color:#e5cdd4;background:#faf1f3;}

  /* Empty states use three names, by container rather than by page:
   *   .empty        — standalone (a block in a grid, or a bordered card)
   *   .empty-row td — inside a table, where it has to be a <tr>
   *   .empty-note   — a small inline note beside other content
   * Values stay page-appropriate; only the vocabulary is shared. */
  .empty{padding:60px 0;text-align:center;color:var(--ink-3);font-size:.85rem;display:none;}

  footer.note{
    margin-top:44px;font-size:.68rem;color:var(--ink-3);text-align:center;
  }

  @media (max-width:900px){ .sidebar{display:none;} .main{padding:18px;} }

  .viewer-chip{display:inline-flex;align-items:center;gap:6px;font-size:.64rem;font-weight:700;color:var(--ec-blue-dark);background:#e6f4fb;border:1px solid #c4e5f5;border-radius:99px;padding:4px 10px;margin-top:14px;}
</style>
<!-- Loaded in <head>, not at the end of <body>: it injects the rules that
     hide feature-flagged elements, and those must exist before first paint
     or the flagged nav row and the 提案中 ribbons flash in and out. -->
<script src="feature-flags.js"></script>
</head>

<!-- ───────── Main ───────── -->
<main class="main">

  <section class="hero">
    <div class="page-head">
      <div class="ph-text">
        <h1><em>教學工具箱</em></h1>
        <p class="sub">為你而設的備課、評估和教學小幫手。<br>只需先選科目，再按學段挑選合適工具，就可以在數分鐘內完成日常教學準備。</p>
      </div>
    </div>

    <div class="pill-row" role="tablist" aria-label="科目">
      <span class="row-label">科目</span>
      <button class="pill" data-subj="sci" onclick="setSubject(this)">科學</button>
      <button class="pill on" data-subj="chi" onclick="setSubject(this)">中文</button>
      <button class="pill" data-subj="maths" onclick="setSubject(this)">數學<span class="soon">即將推出</span></button>
      <button class="pill" data-subj="eng" onclick="setSubject(this)">英文<span class="soon">即將推出</span></button>
    </div>

  </section>

  <div class="controls">
    <div class="search">
      <input id="searchInput" type="text" placeholder="搜尋工具，例如「工作紙」、「文言文」…">
      <button onclick="applyFilters()">搜尋</button>
    </div>
    <div class="seg-toggle" role="tablist" aria-label="學段">
      <button id="btn-primary" class="on" onclick="setLevel('primary')">🎒 小學</button>
      <button id="btn-secondary" onclick="setLevel('secondary')">🎓 中學</button>
    </div>
  </div>

  <div class="tabs-row">
    <span class="row-label">你的工具箱</span>
    <button class="pill-sm on" data-cat="all" onclick="setCat(this)">全部工具</button>
    <button class="pill-sm" data-cat="planning" onclick="setCat(this)">課堂準備</button>
    <button class="pill-sm" data-cat="assessment" onclick="setCat(this)">評估</button>
    <button class="pill-sm" data-cat="literacy" onclick="setCat(this)">讀寫教學</button>
    <button class="pill-sm" data-cat="admin" onclick="setCat(this)">行政與家校</button>
  </div>

  <div class="result-count" id="resultCount"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">找不到符合的工具，試試其他關鍵字。</div>
  <div class="coming-soon" id="comingSoon">
    <div class="cs-icon">🚧</div>

<script>

/* levels: 'both' | 'primary' | 'secondary'
 * subject: 'chi' | 'sci' | 'maths' | 'eng' — which subject's catalog a tool
 *   belongs to. Entries without it default to 'chi' (see applyFilters), since
 *   this catalog was Chinese-only before 科學 gained its first live tool and
 *   backfilling the field onto every entry would be noise.
 * `recommended:true` sorts a tool to the top of the grid (see applyFilters())
 * and gives it a small "⭐ 推薦" tag — not a separate list, just an ordering
 * + label on the same catalog. */
const TOOLS = [
  /* STAR, EMM and OQB are real, existing EdCity/EDB services (not AI, not
   * built in this prototype) — `link` points to their actual live sites
   * with target:'_blank' so this prototype tab stays open. They lead the
   * catalog, and are tagged recommended, because unlike everything below
   * them they are available to teachers today rather than being concept
   * previews. Facts checked 2026-07-30 / EMM 2026-08-03:
   *   STAR — P1–S3 中文／英文／數學 (spans primary + junior secondary)
   *   EMM  — EDB 教育多媒體, video library across all KLAs, free to use
   *   OQB  — HKDSE past-paper based, secondary-only
   * Order within the recommended block follows this array (applyFilters()
   * uses a stable sort), so STAR → EMM → OQB is set here, not by score. */
  {name:'STAR 學與教評估平台', en:'STAR Assessment Platform', cat:'assessment', level:'both', color:'var(--ec-red)', icon:'star', isNew:true, recommended:true,
   link:'https://star.hkedcity.net/zh-hant', target:'_blank',
   desc:'超過 73,000 條評估題目，涵蓋小一至中三的中文、英文及數學，並設「學生自選評估」，讓學生可以自主挑選練習內容。'},
  {name:'EMM 教育多媒體', en:'Educational Multimedia', cat:'planning', level:'both', color:'var(--ec-blue)', icon:'slides', isNew:true, recommended:true,
   link:'https://emm.edcity.hk/', target:'_blank',
   desc:'教育局製作的教學影片資源庫，涵蓋各學習領域及幼稚園至高中。影片可直接在課堂播放，部分更附有教學資源供下載。'},
  {name:'OQB 網上試題學習平台', en:'Online Question Bank', cat:'assessment', level:'secondary', color:'var(--ec-red)', icon:'bank', isNew:true, recommended:true,
   link:'https://teacher.edcity.hk/zh-hant/oqb/introduction/', target:'_blank',
   desc:'超過 10,000 條公開試題（涵蓋各科 DSE），供學校靈活組卷作練習，並提供作答數據分析。以全校、全科目模式訂購。'},
  /* Unlike the rest of this catalog (which drill into the tool-form.html
   * concept preview), AI 批改 is a real, already-built page — link straight
   * to it via `link`, no query-string placeholder. See applyFilters()'s
   * onclick for the branch that checks this field. */
  {name:'AI 批改', en:'AI Marking Assistant', cat:'assessment', level:'both', color:'var(--ec-red)', icon:'pen', isNew:false, link:'marking.html', recommended:true,
   desc:'協助批改學生作答，自動標示能力標籤並生成回饋重點，與學習紀錄庫共用同一套分類。'},
  {name:'教案生成器', en:'Lesson Plan Generator', cat:'planning', level:'both', color:'var(--ec-blue)', icon:'doc', isNew:false, recommended:true,
   desc:'只需輸入課文或單元主題，即可生成包含學習目標、教學流程及分層活動的中文科教案。'},
  {name:'工作紙生成器', en:'Worksheet Generator', cat:'planning', level:'both', color:'var(--ec-blue)', icon:'pen', isNew:false,
   desc:'按課文重點生成字詞、句式及理解練習的工作紙，可按需要調整程度深淺。'},
  {name:'簡報生成器', en:'Presentation Generator', cat:'planning', level:'both', color:'var(--ec-blue)', icon:'slides', isNew:false,
   desc:'將課文重點轉化為課堂簡報大綱及頁面，並支援下載為 PPTX 檔案。'},
  {name:'測驗題生成器', en:'Quiz Generator', cat:'assessment', level:'both', color:'var(--ec-red)', icon:'quiz', isNew:true, recommended:true,
   desc:'生成選擇、填充、短答等混合題型的測驗，並提供答案及評分建議。'},
  {name:'評分準則生成器', en:'Rubric Generator', cat:'assessment', level:'both', color:'var(--ec-red)', icon:'rubric', isNew:false,
   desc:'為寫作及說話任務建立清晰評分準則，方便與學生和家長溝通。'},
  {name:'閱讀理解生成器', en:'Reading Comprehension', cat:'literacy', level:'both', color:'var(--ec-green)', icon:'read', isNew:false,
   desc:'按主題及程度生成篇章和理解題目，涵蓋記敘、說明及議論三類文體。'},
  {name:'詞語學習卡', en:'Vocabulary Flashcards', cat:'literacy', level:'both', color:'var(--ec-green)', icon:'cards', isNew:false,
   desc:'生成詞語及成語學習卡，附例句、近義詞以及常見誤用提示。'},
  {name:'成績表評語助手', en:'Report Card Comments', cat:'admin', level:'both', color:'var(--ec-amber)', icon:'comment', isNew:false,
   desc:'按學生表現重點生成個人化評語，語氣正面而具體，方便老師快速完成成績表。'},
  {name:'家校通訊生成器', en:'Class Newsletter', cat:'admin', level:'both', color:'var(--ec-amber)', icon:'mail', isNew:false,
   desc:'協助快速撰寫班級通訊及家長信，涵蓋學習重點、活動資訊及溫馨提示。'},
  /* Primary only */
  {name:'看圖寫作助手', en:'Picture Composition Helper', cat:'literacy', level:'primary', color:'var(--ec-green)', icon:'brush', isNew:true, recommended:true,
   desc:'為看圖寫作課堂生成圖畫描述框架、提問階梯以及範例句式。'},
  {name:'筆順練習生成器', en:'Stroke Order Practice', cat:'literacy', level:'primary', color:'var(--ec-green)', icon:'pen', isNew:false,
   desc:'按課文生字生成筆順練習和田字格工作紙，並支援分級字表設定。'},
  /* Secondary only */
  {name:'文言文解讀助手', en:'Classical Chinese Assistant', cat:'literacy', level:'secondary', color:'var(--ec-green)', icon:'scroll', isNew:true, recommended:true,
   desc:'為文言篇章生成語譯對照、重點虛詞解說，以及課堂提問設計。'},
  {name:'議論文寫作教練', en:'Argumentative Writing Coach', cat:'literacy', level:'secondary', color:'var(--ec-green)', icon:'debate', isNew:false,
   desc:'協助建立論點、論據及駁論結構，並生成寫作評改重點。'},

  /* ── 科學科 ──
   * Real product, confirmed 2026-08-03 from EdCity's own screenshot deck
   * (sci_ed_ai_sc.pptx, last updated 2026-03-02). In-product it brands as
   * "SciAi", under 教育局 科學教育組, subtitled 科學教育人工智能教學助理.
   * Its home screen exposes eight tools: 教學進度安排／教案設計／科學知識樹／
   * 課業或評估設計／評量表設計／紙筆評估設計／課堂提問模擬器／課程銜接工具,
   * with primary and secondary levels selectable. No public URL captured, so
   * this stays on the tool-form.html concept preview like the rest. */
  {name:'SciAi 科學教育 AI 教學助理', en:'EDB Science Department AI', cat:'planning', level:'both', color:'var(--ec-blue)', icon:'doc', isNew:true, subject:'sci',
   desc:'由教育局科學教育組開發的教學助理工具，涵蓋教學進度安排、教案設計、科學知識樹、課業及評估設計、評量表、紙筆評估、課堂提問模擬以及課程銜接。小學及中學均適用。'}
];

let level = 'primary';
let cat = 'all';
let subject = 'chi';
const SUBJ_NAME = {chi:'中文', maths:'數學', eng:'英文', sci:'科學'};

function setSubject(btn){
  subject = btn.dataset.subj;
  document.querySelectorAll('.pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  applyFilters();
}

function setLevel(l){
  level = l;
  document.getElementById('btn-primary').classList.toggle('on', l==='primary');
  document.getElementById('btn-secondary').classList.toggle('on', l==='secondary');
  applyFilters();
}
function setCat(btn){
  cat = btn.dataset.cat;
  document.querySelectorAll('.pill-sm').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  applyFilters();
}
function levelBadge(t){
  if(t.level==='primary') return '<span class="badge-level p-only">小學</span>';
  if(t.level==='secondary') return '<span class="badge-level s-only">中學</span>';
  return '<span class="badge-level">小·中</span>';
}
/* Recommended shelf — a curated highlight above the filterable catalog.
 * Cards here still also appear in their normal category down in the main
 * grid; this is a shortcut to a few tools worth trying first, not a
 * separate/exclusive list. Uses the same onclick branch (real `link` vs
 * tool-form.html placeholder) as the main grid. */
function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  const cs = document.getElementById('comingSoon');
  /* Coming-soon is now driven by whether the subject actually has any tools,
   * rather than a hardcoded `subject !== 'chi'`. That check predated 科學
   * having a live tool and would have kept the 即將推出 panel up even once
   * one existed. Subjects with an empty catalog still fall through to it. */
  const forSubject = TOOLS.filter(t => (t.subject || 'chi') === subject);
  if(forSubject.length === 0){
    grid.innerHTML = '';
    document.getElementById('empty').style.display = 'none';
    cs.style.display = 'block';
    document.getElementById('csTitle').textContent = SUBJ_NAME[subject] + '科 · 即將推出';
    document.getElementById('resultCount').textContent = SUBJ_NAME[subject] + '科工具籌備中';
    /* Body copy names the subject you're looking at FIRST in the "陸續加入"
     * list, so it reads as a direct answer to "when is mine coming?" rather
     * than a generic notice. Derived from which subjects still have an empty
     * catalog, so it stays correct without hand-editing if 數學 or 英文 later
     * gains a tool (that subject simply stops reaching this branch). */
    const pending = Object.keys(SUBJ_NAME)
      .filter(k => TOOLS.every(t => (t.subject || 'chi') !== k));
    const others = pending.filter(k => k !== subject).map(k => SUBJ_NAME[k] + '科');
    const queue = [SUBJ_NAME[subject] + '科', ...others].join('及');
    document.getElementById('csBody').textContent =
      `現正籌備此科目的教學工具。首階段以科學及中文科作試點，其後會陸續加入${queue}。`;
    return;
  }
  cs.style.display = 'none';
  const shown = forSubject.filter(t =>
    (t.level==='both' || t.level===level) &&
    (cat==='all' || t.cat===cat) &&
    (!q || t.name.toLowerCase().includes(q) || t.en.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q))
  );
  /* Recommended tools float to the top of whatever's already showing —
   * a stable sort, so within "recommended" and within "not recommended"
   * the original catalog order is preserved. No separate list, no
   * duplication; just a "推薦" tag (see .rec-tag) so it reads as a label,
   * not a different set of tools. */
  shown.sort((a,b) => (b.recommended?1:0) - (a.recommended?1:0));
  grid.innerHTML = shown.map(t => `
    <div class="card" style="--accent:${t.color}" tabindex="0" role="button" aria-label="${t.name}" onclick="${t.link ? (t.target==='_blank' ? `window.open('${t.link}','_blank')` : `location.href='${t.link}'`) : `location.href='tool-form.html?n='+encodeURIComponent('${t.name}')+'&d='+encodeURIComponent('${t.desc}')`}">
      <div class="top">
        <div class="tile">${IC[t.icon]}</div>
        <div class="ttl">
          <div class="hd">
            <h3>${t.name}</h3>
            <div class="badges">${t.recommended ? '<span class="rec-tag">⭐ 推薦</span>' : ''}${levelBadge(t)}</div>
          </div>
          <span class="en">${t.en}</span>
        </div>
      </div>
      <p>${t.desc}</p>
    </div>`).join('');
  document.getElementById('empty').style.display = shown.length ? 'none' : 'block';
  document.getElementById('resultCount').textContent =
    `顯示 ${shown.length} 個工具 · ${level==='primary'?'小學':'中學'}適用`;
}
document.getElementById('searchInput').addEventListener('input', applyFilters);
applyFilters();
</script>
