<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdCity 課文工房 — 我的教材</title>
<!-- Site-wide typeface: Chiron GoRound TC, a rounded Traditional Chinese sans
     built on Source Han Sans/Chiron Hei HK.

     Served from Google Fonts (Eric's call, 2026-08-21) rather than self-hosted
     and subsetted. The subset was built from the characters the prototype
     happened to contain, which cannot be right for a tool whose whole premise
     is a teacher pasting arbitrary 課文 — 岳 was missing the moment 岳陽樓記
     was added. Google's unicode-range delivery gives full coverage while the
     browser fetches only the ranges each page actually touches.

     display=block, not swap: swap paints the fallback first and Chiron has
     different metrics, so every nav row changed height on the swap. block has
     nothing to swap from.

     Trade-off recorded in the Decision Log: this sends each visitor's IP to
     Google, which a government-funded body may not be able to ship. Falls back
     to PingFang TC / Microsoft JhengHei / Noto Sans TC if it cannot load. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=block">
<style>
  :root{
    --ec-blue:#008BD1;--ec-blue-dark:#0072ab;--ec-red:#ED1A2E;--ec-green:#00AC6C;
    --ec-maroon:#7B2539;--ec-amber:#F5A623;--ec-purple:#7C5CDB;
    --ink:#1e2a35;--ink-2:#55636f;--ink-3:#8a97a3;--line:#e6ebf0;--bg:#f1f2f8;font-size:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);display:flex;min-height:100vh;}
  .sidebar{width:248px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .sidebar .logo-wrap{padding:20px 16px 20px;border-bottom:1px solid var(--line);}
  .sidebar .logo-wrap img{width:100%;height:auto;display:block;}
  .sidebar .logo-sub{font-size:.8rem;font-weight:700;color:var(--ink-2);margin-top:16px;letter-spacing:normal;}
  .viewer-chip{display:inline-flex;align-items:center;gap:6px;font-size:.64rem;font-weight:700;color:var(--ec-blue-dark);background:#e6f4fb;border:1px solid #c4e5f5;border-radius:99px;padding:4px 10px;margin-top:14px;}
  .nav{padding:14px 10px;flex:1;overflow-y:auto;}
  /* Spacing between nav groups. This rule was missing on most pages, so the
   * Ideas Lab box sat 14px below the last link (its own margin-top) instead of
   * the 18px the two margins collapse to when it's present — the box visibly
   * hugged 校本教材庫 on those pages and not on chat/index/agents. */
  .nav-group{margin-bottom:18px;}
  .nav-group h6{font-size:.66rem;font-weight:600;color:var(--ec-blue);letter-spacing:normal;padding:0 10px 8px;text-transform:uppercase;}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-size:.85rem;margin-bottom:2px;}
  /* Ideas Lab — screens that are proposals, not built features. Grouped and
   * pill-tagged so the status is visible from the nav and from the page
   * headline, without having to open the page and read its ribbon. */
  .nav-group.ideas{background:#fbf7ef;border:1px solid #f0e4cf;border-radius:12px;padding:10px 4px 8px;margin-top:14px;}
  /* The nav no longer carries a per-link "Ideas Lab" pill — the group heading
   * above already says it, so the pill was pure repetition, and it was the pill
   * rather than the label that made the 248px sidebar tight. nowrap is kept so
   * a long label still can't reflow onto a second line. */
  .nav a{white-space:nowrap;}
  /* Hover/active inside the Ideas Lab box use the box's own amber family —
   * the default blue tints read as a different system sitting inside a warm
   * container. (The bronze nav pill this once had to coexist with is gone.) */
  .nav-group.ideas a:hover{background:#f4e9d6;}
  .nav-group.ideas a.active{background:#ecdcbe;color:#7a4f08;font-weight:600;}
  /* Flask marks the Ideas Lab section: these pages are experiments, not built
   * features. Sized to the text it sits beside rather than to the nav icons —
   * it labels the group, it isn't a nav item of its own. */
  .nav-group.ideas h6{display:flex;align-items:center;gap:6px;color:#8a5a09;}
  .lab-ic{width:1.05em;height:1.05em;flex-shrink:0;}
  .nav a:hover{background:#f2f6f9;}
  .nav a.active{background:#e6f4fb;color:var(--ec-blue-dark);font-weight:600;}
  .nav a .ic{width:17px;height:17px;flex-shrink:0;}
  .sidebar .user{border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .sidebar .user .avatar{width:34px;height:34px;border-radius:50%;background:var(--ec-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;}
  .sidebar .user .meta b{font-size:.8rem;display:block;}
  .sidebar .user .meta span{font-size:.68rem;color:var(--ink-3);}

  .main{flex:1;min-width:0;padding:44px 34px 80px;}
  .ribbon{display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:700;color:#8a6d00;background:#fdf1c7;border:1px solid #f0dfa0;border-radius:99px;padding:5px 14px;margin-bottom:16px;}
  .hero{margin-bottom:24px;border-bottom:1px solid var(--line);}
  h1{font-size:1.8rem;font-weight:800;color:var(--ec-blue);margin-bottom:16px;}
  .sub{font-size:.9rem;color:var(--ink-2);margin:6px 0 32px;max-width:52em;line-height:1.6;}

  /* Three bands, each answering a different question, so the upload action
   * is never mistaken for a search or filter control:
   *   1. .page-head  — what is this page, and the one thing you can CREATE here
   *   2. .stat-row   — filter by status (in use / pending / all)
   *   3. .toolbar    — filter by source, plus search
   * Upload previously sat immediately right of the search box, which read as
   * "search-related", and its label collided with the 我上載的 filter chip
   * two positions away. */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-head .ph-text{flex:1;min-width:280px;}
  .row-label{font-size:.68rem;font-weight:600;color:var(--ink-2);margin-right:2px;white-space:nowrap;}
  .stat-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 17px;font-size:.72rem;color:var(--ink-3);min-width:140px;cursor:pointer;font-family:inherit;text-align:left;transition:box-shadow .12s;}
  .stat:hover{box-shadow:0 0 0 2px rgba(0,0,0,.05);}
  .stat.on{border-color:var(--ec-blue);box-shadow:0 0 0 2px #e6f4fb;background:#f7fbfe;}
  .stat.on b{color:var(--ec-blue-dark);}
  .stat b{display:block;font-size:1.05rem;color:var(--ink);margin-bottom:2px;}


  /* Upload — the page copy promises 「存放你上載的教材」, so the library needs a
   * visible way in. Mockup only (see the 提案中 ribbon): it reads real filenames
   * off a native file input so the flow feels true, but nothing is transmitted
   * or stored — the rows live in memory for the session. */
  .up-btn{display:inline-flex;align-items:center;gap:7px;background:var(--ec-blue);color:#fff;border:none;
    border-radius:10px;padding:9px 16px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;
    transition:background .15s ease;white-space:nowrap;}
  .up-btn:hover{background:var(--ec-blue-dark);}
  .up-panel{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:16px;}
  .up-panel.show{display:block;}
  /* No sub-line under the heading: the dropzone below self-explains, and what
   * happens after upload is stated once in .up-note rather than twice. h3 now
   * carries the gap the removed sub used to provide. */
  .up-panel h3{font-size:.9rem;font-weight:700;margin-bottom:14px;}
  .dropzone{border:2px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;
    cursor:pointer;background:#fafcfd;transition:border-color .15s ease,background .15s ease;}
  .dropzone:hover,.dropzone.drag{border-color:var(--ec-blue);background:#f4fafd;}
  .dropzone .dz-ic{font-size:1.5rem;display:block;margin-bottom:8px;}
  .dropzone b{display:block;font-size:.84rem;margin-bottom:4px;}
  .dropzone small{font-size:.7rem;color:var(--ink-3);line-height:1.55;}
  .up-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .up-file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
    padding:9px 13px;font-size:.78rem;}
  .up-file .f-ic{font-size:1.05rem;flex-shrink:0;}
  .up-file b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .up-file .sz{font-size:.7rem;color:var(--ink-3);flex-shrink:0;}
  .up-file .rm{border:none;background:transparent;color:var(--ink-3);cursor:pointer;font-size:.9rem;
    padding:2px 4px;font-family:inherit;flex-shrink:0;}
  .up-file .rm:hover{color:var(--ec-red);}
  /* Upload progress. Nielsen's first heuristic — visibility of system status:
   * an instant row appearing gives no sense that anything was transferred, and
   * a spinner alone doesn't say how far along it is. The bar sits ON the file
   * item so the object the teacher chose is the object that shows progress,
   * then that item resolves to a tick before the row lands in the table below.
   * Faked timings, but the shape matches a real upload. */
  .up-file{position:relative;overflow:hidden;transition:border-color .2s ease,background .2s ease;}
  .up-file .bar{
    position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--ec-blue);
    transition:width .18s linear;
  }
  .up-file.uploading{border-color:#c4e5f5;background:#f7fbfe;}
  .up-file.done{border-color:#bfe8d7;background:#effaf5;}
  .up-file.done .bar{background:var(--ec-green);}
  .up-file .pct{font-size:.68rem;color:var(--ec-blue-dark);font-weight:700;flex-shrink:0;min-width:34px;text-align:right;}
  .up-file.done .pct{color:#0c6b48;}
  @media (prefers-reduced-motion:reduce){ .up-file .bar{transition:none;} }
  .up-actions{display:flex;gap:9px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .up-note{font-size:.7rem;color:var(--ink-3);line-height:1.6;margin-top:10px;}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .pill-sm{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:.78rem;color:var(--ink-2);cursor:pointer;font-family:inherit;transition:border-color .15s ease;}
  .pill-sm:not(.on):hover{border-color:var(--ec-blue);}
  .pill-sm.on{background:var(--ec-blue);border-color:var(--ec-blue);color:#fff;font-weight:600;}
  .search{flex:1;min-width:180px;max-width:280px;border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:.8rem;font-family:inherit;outline:none;background:#fff;}
  .search:focus{border-color:var(--ec-blue);}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  th,td{text-align:left;padding:12px 16px;font-size:.8rem;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:.68rem;letter-spacing:normal;color:var(--ink-3);font-weight:600;background:#fafcfd;}
  tr:last-child td{border-bottom:none;}
  .m-name{display:flex;gap:10px;align-items:flex-start;}
  .m-name .stripe{width:3px;border-radius:3px;flex-shrink:0;align-self:stretch;min-height:32px;}
  .m-name b{font-size:.84rem;display:block;}
  .just-saved{font-size:.6rem;font-weight:700;color:#0c6b48;background:#effaf5;border:1px solid #bfe8d7;border-radius:99px;padding:2px 8px;margin-left:7px;white-space:nowrap;}
  .m-name small{font-size:.7rem;color:var(--ink-3);line-height:1.5;display:block;margin-top:2px;}
  .tchip{font-size:.66rem;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap;}
  .tchip.report{color:var(--ec-blue-dark);background:#e6f4fb;border:1px solid #c4e5f5;}
  .tchip.sheet{color:var(--ec-green);background:#effaf5;border:1px solid #bfe8d7;}
  .tchip.xs{color:var(--ec-purple);background:#f1edfb;border:1px solid #ddd3f5;}
  .tchip.up{color:var(--ink-2);background:#f2f5f8;border:1px solid var(--line);}
  .usage{font-size:.74rem;color:var(--ink-2);line-height:1.6;}
  .usage .none{color:var(--ink-3);}
  .usage .pending{color:#b07c10;}
  .lbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-size:.78rem;color:var(--ec-blue-dark);font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap;}
  .lbtn:hover{border-color:var(--ec-blue);}
  .date{font-size:.76rem;color:var(--ink-3);white-space:nowrap;}
  .empty-row td{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:.8rem;}

  .link-note{
    margin-top:18px;background:#effaf5;border:1px solid #bfe8d7;border-radius:12px;
    padding:11px 15px;font-size:.76rem;color:#0c6b48;line-height:1.65;max-width:52em;
  }

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.78rem;padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:120;}
  .toast.show{opacity:.94;}
  footer.note{margin-top:40px;font-size:.68rem;color:var(--ink-3);text-align:center;}
  @media (max-width:900px){.sidebar{display:none;}.main{padding:18px;}}
  /* Portal switcher */
  .portal-sw{position:relative;padding:12px 12px 0;}
  .ps-btn{width:100%;display:flex;align-items:center;gap:9px;background:#f7fafc;border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;cursor:pointer;font-family:inherit;text-align:left;}
  .ps-btn:hover{border-color:var(--ec-blue);}
  .ps-ic{font-size:1rem;flex-shrink:0;}
  .ps-txt{flex:1;min-width:0;}
  .ps-txt small{display:block;font-size:.6rem;color:var(--ink-3);letter-spacing:.04em;}
  .ps-txt b{display:block;font-size:.82rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ps-car{font-size:.62rem;color:var(--ink-3);flex-shrink:0;}
  .portal-menu{position:absolute;top:calc(100% + 4px);left:12px;right:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 30px rgba(20,30,40,.16);padding:6px;display:none;z-index:60;}
  .portal-menu.show{display:block;}
  .portal-menu a{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:9px;
    text-decoration:none;color:var(--ink-2);}
  .portal-menu a:hover{background:#f2f6f9;}
  .portal-menu a.on{background:#e6f4fb;}
  .portal-menu .pm-ic{font-size:.95rem;}
  .portal-menu b{display:block;font-size:.8rem;color:var(--ink);}
  .portal-menu small{display:block;font-size:.66rem;color:var(--ink-3);line-height:1.45;margin-top:1px;}

  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--ec-blue);color:#fff;border:none;
    border-radius:10px;padding:10px 20px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;
    transition:background .15s ease;white-space:nowrap;}
  .btn:hover{background:var(--ec-blue-dark);}
  .btn.ghost{background:#fff;color:var(--ec-blue-dark);border:1px solid var(--line);font-weight:600;}
  .btn.ghost:hover{background:#f2f8fb;border-color:var(--ec-blue);}

  /* ── 課文工房 ─────────────────────────────────────────────────────────
   * Rehoused from a standalone top-bar POC into the teacher shell. The POC's
   * own second-level nav (開始準備 / 我的教材) becomes a tab strip inside the
   * page, since the sidebar already carries first-level navigation. */
  .tw-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;}
  .tw-tab{border:none;background:none;padding:10px 2px;margin-right:22px;font-family:inherit;font-size:.86rem;
    font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tw-tab:hover{color:var(--ink-2);}
  .tw-tab.on{color:var(--ec-blue-dark);border-bottom-color:var(--ec-blue);}

  .tw-stage{display:none;}
  .tw-stage.on{display:block;}

  /* form */
  .tw-grid{display:grid;grid-template-columns:236px 1fr;gap:26px;align-items:start;}
  @media (max-width:1000px){.tw-grid{grid-template-columns:1fr;}}
  .tw-rail{background:#f2f8fb;border:1px solid #d8ecf6;border-radius:14px;padding:18px 20px;position:sticky;top:26px;}
  .tw-rail h3{font-size:.86rem;font-weight:800;margin-bottom:14px;}
  .tw-step{display:flex;gap:11px;margin-bottom:15px;}
  .tw-step .n{width:22px;height:22px;border-radius:50%;background:var(--ec-blue);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;}
  .tw-step b{font-size:.8rem;display:block;}
  .tw-step small{font-size:.72rem;color:var(--ink-3);display:block;margin-top:2px;line-height:1.55;}

  .tw-q{font-size:1rem;font-weight:800;margin-bottom:3px;}
  .tw-qs{font-size:.76rem;color:var(--ink-3);margin-bottom:14px;}
  .scope-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
  @media (max-width:760px){.scope-grid{grid-template-columns:1fr;}}
  .scope{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;cursor:pointer;font-family:inherit;}
  .scope:hover{border-color:var(--ec-blue);}
  .scope.on{border-color:var(--ec-blue);background:#f2f8fb;box-shadow:0 0 0 1px var(--ec-blue);}
  .scope[disabled]{cursor:default;opacity:.55;background:#fafbfc;}
  .scope[disabled]:hover{border-color:var(--line);}
  .scope .si{font-size:1.1rem;line-height:1.2;flex-shrink:0;}
  .scope b{font-size:.86rem;display:block;}
  .scope small{font-size:.72rem;color:var(--ink-3);display:block;margin-top:3px;line-height:1.5;}
  .scope .soon{display:inline-block;font-size:.64rem;font-weight:700;color:var(--ink-3);background:#eef2f6;
    border-radius:99px;padding:2px 9px;margin-top:6px;}

  .tw-sep{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--ink-3);font-size:.72rem;}
  .tw-sep::before,.tw-sep::after{content:"";flex:1;height:1px;background:var(--line);}
  .tw-upload{display:flex;align-items:center;gap:14px;background:#fafbfc;border:1px solid var(--line);
    border-radius:12px;padding:15px 18px;}
  .tw-upload b{font-size:.84rem;display:block;}
  .tw-upload small{font-size:.72rem;color:var(--ink-3);}
  .tw-upload .btn{margin-left:auto;flex-shrink:0;}

  .tw-field{margin-bottom:16px;}
  .tw-field label{display:block;font-size:.78rem;font-weight:600;margin-bottom:6px;}
  .tw-field input[type=text],.tw-field select,.tw-field textarea{width:100%;border:1px solid var(--line);
    border-radius:10px;padding:10px 13px;font-size:.82rem;font-family:inherit;background:#fff;color:var(--ink);}
  .tw-field textarea{resize:vertical;min-height:190px;line-height:1.8;}
  .tw-row{display:grid;grid-template-columns:1fr 150px;gap:14px;}
  @media (max-width:640px){.tw-row{grid-template-columns:1fr;}}
  .tw-count{font-size:.72rem;color:var(--ink-3);margin-top:6px;}
  .tw-check{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:16px;margin-top:20px;}
  .tw-check input{margin-top:3px;width:16px;height:16px;accent-color:var(--ec-blue);flex-shrink:0;}
  .tw-check b{font-size:.82rem;display:block;font-weight:600;}
  .tw-check small{font-size:.72rem;color:var(--ink-3);display:block;margin-top:2px;line-height:1.55;}
  .tw-go{display:flex;justify-content:flex-end;margin-top:22px;}
  .btn[disabled]{opacity:.45;cursor:default;}
  .btn[disabled]:hover{background:var(--ec-blue);}

  /* text identity header, replaces the page head once a text is loaded */
  .tw-id{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:30px;
    border-bottom:1px solid var(--line);padding-bottom:18px;}
  .tw-id h1{font-size:1.7rem;margin-bottom:0;color:var(--ink);}
  .tw-id .meta{font-size:.82rem;color:var(--ink-3);}
  .tw-id .swap{margin-left:auto;font-size:.78rem;color:var(--ec-blue-dark);background:none;border:none;
    cursor:pointer;font-family:inherit;font-weight:600;}

  /* progress */
  .tw-prog{max-width:660px;margin:0 auto;text-align:center;}
  .tw-prog .orb{width:62px;height:62px;border-radius:50%;background:#e6f4fb;display:inline-flex;
    align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:18px;position:relative;}
  .tw-prog .orb::after{content:"";position:absolute;top:2px;right:2px;width:11px;height:11px;
    border-radius:50%;background:var(--ec-blue);}
  .tw-prog h2{font-size:1.6rem;font-weight:800;margin-bottom:8px;}
  .tw-prog .lede{font-size:.84rem;color:var(--ink-2);line-height:1.7;margin-bottom:26px;}

<script>
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}

const KIND = Materials.KIND;
let TFILTER = 'all';   /* which tool made it */
let KFILTER = 'all';   /* what kind of material it is */

/* SEED and the store both live in materials.js now. */

/* Finished work is claimed from the shared record and becomes an ordinary
 * library row. Jobs.harvest empties as it hands over, so nothing accumulates
 * in two places — this library owns the material from that moment on. */
function all(){
  /* Finished work is claimed by the tool that made it, not by the library —
   * saving is the teacher's decision (2026-08-21), so nothing arrives here
   * without her having said so. */
  return Materials.all();
}

function render(){
  const everything = all();
  const running    = Jobs.running();

  /* Counts drive which chips are live, so a filter can never lead to an empty
   * shelf — the standing rule is that a dead option is noise, not an option. */
  const count = (tool, kind) =>
    everything.filter(x => (tool === 'all' || x.tool === tool) &&
                           (kind === 'all' || x.kind === kind)).length +
    running.filter(j  => (tool === 'all' || j.tool === tool) &&
                           (kind === 'all' || j.kind === kind)).length;

  const tools = Materials.tools();
  running.forEach(j => { if(j.tool && !tools[j.tool]) tools[j.tool] = j.toolName || j.tool; });

  document.getElementById('toolFilters').innerHTML =
    [['all','全部工具']].concat(Object.keys(tools).map(t => [t, tools[t]]))
      .map(([k,l]) => {
        const n = count(k, KFILTER);
        return '<button class="chip' + (TFILTER===k?' on':'') + '"' +
               (n?'':' disabled') + ' onclick="setTool(\'' + k + '\')">' + l + '</button>';
      }).join('');

  document.getElementById('filters').innerHTML =
    [['all','全部']].concat(Object.keys(KIND).map(k => [k, KIND[k].name]))
      .map(([k,l]) => {
        const n = count(TFILTER, k);
        return '<button class="chip' + (KFILTER===k?' on':'') + '"' +
               (n?'':' disabled') + ' onclick="setF(\'' + k + '\')">' + l + '</button>';
      }).join('');

  const keep = x => (TFILTER === 'all' || x.tool === TFILTER) &&
                    (KFILTER === 'all' || x.kind === KFILTER);
  const items = everything.filter(keep);
  const run   = running.filter(keep);

  const box = document.getElementById('list');

  /* 製作中 rows lead, because they are what the teacher came back to see. */
  const runHtml = run.length ? ('<div class="mgroup"><h3>製作中</h3>' +
    '<div class="gs">可以離開這一頁，完成後會留在下方的教材列表。</div>' +
    run.map(j => '<div class="mcard making"><span class="mi">' + KIND[j.kind].icon + '</span>' +
      '<div style="flex:1;min-width:0"><b>' + j.title + '</b>' +
      '<small>《' + j.text + '》・' + Jobs.remainingLabel(j) + '</small>' +
      '<div class="mprog"><div class="f" style="width:' + Math.round(Jobs.progress(j)*100) + '%"></div></div></div>' +
      '<span class="mk-tag">製作中</span></div>').join('') + '</div>') : '';

  if(!items.length && !run.length){
    box.innerHTML = '<div class="mm-empty"><span class="ei">📄</span><b>還沒有教材</b>' +
      '<p>到教學工具箱挑一個工具，做好之後儲存，就會出現在這裏。</p>' +
      '<button class="btn" onclick="location.href=\'index.html\'">前往教學工具箱</button></div>';
    return;
  }

  const byText = {};
  items.forEach(x => { (byText[x.text] = byText[x.text] || []).push(x); });

  box.innerHTML = Object.keys(byText).map(t => {
    const g = byText[t];
    return '<div class="mgroup"><h3>《' + t + '》</h3>' +
      '<div class="gs">' + g[0].level + '・' + g.length + ' 份教材・最近更新 ' + g[0].at + '</div>' +
      g.map(x => '<div class="mcard"><span class="mi">' + KIND[x.kind].icon + '</span>' +
        '<div><b>' + x.title + '</b><small>' + KIND[x.kind].name +
        (x.toolName ? '・' + x.toolName : '') + '・建立於 ' + x.at + '</small></div>' +
        '<div class="acts"><button onclick="act()">預覽</button><button onclick="act()">下載</button>' +
        '<button onclick="act()">在課堂使用</button></div></div>').join('') +
      '</div>';
  }).join('');
  box.innerHTML = runHtml + box.innerHTML;
}

function setTool(k){ TFILTER = k; render(); }
function setF(k){ KFILTER = k; render(); }

/* Live while the page is open; on a fresh load the wall-clock in jobs.js has
 * already advanced the work, so returning later shows it further along. */
setInterval(() => { if(Jobs.running().length || document.querySelector('.mcard.making')) render(); }, 1000);
function act(){ toast('示範版本未提供此操作。'); }

const Q = new URLSearchParams(location.search);
if(Q.get('subject')) document.getElementById('backLink').href = 'index.html?subject=' + Q.get('subject');
const n = Q.get('new');
if(n){
  document.getElementById('newNote').style.display = 'flex';
  document.getElementById('newTxt').textContent = '已完成 ' + n + ' 份教材，存放在下方。';
}
render();
</script>
</body>
</html>
