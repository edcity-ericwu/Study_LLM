<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdCity 工具申請進度 — 教師視圖</title>
<!-- Site-wide typeface (2026-07-31): Chiron GoRound TC, a rounded
     Traditional Chinese sans built on Source Han Sans/Chiron Hei HK,
     replacing the plain system-font stack. Falls back to the previous
     stack (PingFang TC / Microsoft JhengHei / Noto Sans TC / system) if
     the network font fails to load. -->
<link rel="preload" href="fonts/chiron-goround-tc-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/chiron-goround-tc-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/chiron-goround-tc-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/chiron-goround-tc-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/chiron-goround-tc-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --ec-blue:#008BD1;--ec-blue-dark:#0072ab;--ec-red:#ED1A2E;--ec-green:#00AC6C;
    --ec-maroon:#7B2539;--ec-amber:#F5A623;--ec-purple:#7C5CDB;
    --ink:#1e2a35;--ink-2:#55636f;--ink-3:#8a97a3;--line:#e6ebf0;--bg:#f1f2f8;font-size:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);display:flex;min-height:100vh;}

  .sidebar{width:248px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .sidebar .logo-wrap{padding:20px 16px 20px;border-bottom:1px solid var(--line);}
  .sidebar .logo-wrap img{width:100%;height:auto;display:block;}
  .sidebar .logo-sub{font-size:.8rem;font-weight:700;color:var(--ink-2);margin-top:16px;letter-spacing:normal;}
  .nav{padding:14px 10px;flex:1;overflow-y:auto;}
  /* Spacing between nav groups. This rule was missing on most pages, so the
   * Ideas Lab box sat 14px below the last link (its own margin-top) instead of
   * the 18px the two margins collapse to when it's present — the box visibly
   * hugged 校本教材庫 on those pages and not on chat/index/agents. */
  .nav-group{margin-bottom:18px;}
  .nav-group h6{font-size:.66rem;font-weight:600;color:var(--ec-blue);letter-spacing:normal;padding:0 10px 8px;text-transform:uppercase;}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-size:.85rem;margin-bottom:2px;}
  /* Ideas Lab — screens that are proposals, not built features. Grouped and
   * pill-tagged so the status is visible from the nav and from the page
   * headline, without having to open the page and read its ribbon. */
  .nav-group.ideas{background:#fbf7ef;border:1px solid #f0e4cf;border-radius:12px;padding:10px 4px 8px;margin-top:14px;}
  /* The nav no longer carries a per-link "Ideas Lab" pill — the group heading
   * above already says it, so the pill was pure repetition, and it was the pill
   * rather than the label that made the 248px sidebar tight. nowrap is kept so
   * a long label still can't reflow onto a second line. */
  .nav a{white-space:nowrap;}
  /* Hover/active inside the Ideas Lab box use the box's own amber family —
   * the default blue tints read as a different system sitting inside a warm
   * container. (The bronze nav pill this once had to coexist with is gone.) */
  .nav-group.ideas a:hover{background:#f4e9d6;}
  .nav-group.ideas a.active{background:#ecdcbe;color:#7a4f08;font-weight:600;}
  /* Flask marks the Ideas Lab section: these pages are experiments, not built
   * features. Sized to the text it sits beside rather than to the nav icons —
   * it labels the group, it isn't a nav item of its own. */
  .nav-group.ideas h6{display:flex;align-items:center;gap:6px;color:#8a5a09;}
  .lab-ic{width:1.05em;height:1.05em;flex-shrink:0;}
  .nav a:hover{background:#f2f6f9;}
  .nav a.active{background:#e6f4fb;color:var(--ec-blue-dark);font-weight:600;}
  .nav a .ic{width:17px;height:17px;flex-shrink:0;}
  .sidebar .user{border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .sidebar .user .avatar{width:34px;height:34px;border-radius:50%;background:var(--ec-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;}
  .sidebar .user .meta b{font-size:.8rem;display:block;}
  .sidebar .user .meta span{font-size:.68rem;color:var(--ink-3);}

  .main{flex:1;min-width:0;padding:44px 34px 80px;}

  .ribbon{
    display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:700;
    color:#8a6d00;background:#fdf1c7;border:1px solid #f0dfa0;border-radius:99px;
    padding:5px 14px;margin-bottom:16px;
  }
  .hero{margin-bottom:24px;border-bottom:1px solid var(--line);}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  h1{font-size:1.8rem;font-weight:800;color:var(--ec-blue);margin-bottom:16px;}
  .sub{font-size:.9rem;color:var(--ink-2);margin:6px 0 32px;max-width:52em;line-height:1.6;}
  .class-pick{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:.82rem;color:var(--ink);}
  .class-pick b{color:var(--ec-blue-dark);}
  .class-pick .chev{color:var(--ink-3);font-size:.65rem;}

  /* ─── Setup stage (評改台 pattern) ─── */
  .stage-chips{display:flex;gap:8px;margin:14px 0 18px;align-items:center;}
  .stage-chip{font-size:.72rem;font-weight:700;border-radius:99px;padding:6px 14px;border:1px solid var(--line);color:var(--ink-3);background:#fff;}
  .stage-chip.on{background:var(--ec-blue);border-color:var(--ec-blue);color:#fff;}
  .stage-chip.done{color:var(--ec-green);border-color:#bfe8d7;background:#effaf5;}
  .stage-arrow{color:var(--ink-3);font-size:.7rem;}
  .setup{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start;}
  @media (max-width:1100px){.setup{grid-template-columns:1fr;}}
  .drop-main{
    border:2px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;
    font-size:.85rem;color:var(--ink-2);cursor:pointer;background:#fff;
  }
  .drop-main:hover{border-color:var(--ec-blue);}
  .drop-main .d-ic{font-size:1.6rem;display:block;margin-bottom:8px;}
  .drop-main small{display:block;font-size:.7rem;color:var(--ink-3);margin-top:5px;}
  .drop-main.filled{border-style:solid;border-color:#bfe8d7;background:#f7fdf9;color:#0c6b48;cursor:default;}
  .drop-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  @media (max-width:700px){.drop-row{grid-template-columns:1fr;}}
  .drop-opt{
    border:2px dashed var(--line);border-radius:12px;padding:18px 14px;text-align:center;
    font-size:.76rem;color:var(--ink-2);cursor:pointer;background:#fff;
  }
  .drop-opt:hover{border-color:var(--ec-blue);}
  .drop-opt b{display:block;font-size:.78rem;margin-bottom:3px;}
  .drop-opt small{font-size:.66rem;color:var(--ink-3);}
  .setup-rail{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:26px;}
  .setup-rail h3{font-size:.9rem;font-weight:700;margin-bottom:12px;}
  .rail-sect{font-size:.7rem;font-weight:700;color:var(--ink-3);letter-spacing:normal;margin:14px 0 8px;}
  .radio-opt{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:.78rem;}
  .radio-opt:has(input:checked){border-color:#c4e5f5;background:#f4fafd;}
  .radio-opt input{margin-top:3px;accent-color:var(--ec-blue);}
  .radio-opt small{display:block;font-size:.66rem;color:var(--ink-3);margin-top:1px;}
  .rail-row{display:flex;align-items:center;justify-content:space-between;font-size:.78rem;padding:9px 0;border-top:1px solid #f2f6f8;}
  .rail-row .val{font-size:.7rem;font-weight:700;color:var(--ec-blue-dark);background:#e6f4fb;border-radius:99px;padding:3px 10px;}
  .start-btn{width:100%;margin-top:14px;border:none;border-radius:12px;padding:13px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;background:linear-gradient(120deg,var(--ec-blue),var(--ec-green));color:#fff;transition:filter .15s ease;}
  .start-btn:hover{filter:brightness(.93);}
  .back-setup{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;font-family:inherit;margin-bottom:14px;}
  .back-setup:hover{border-color:var(--ec-blue);color:var(--ec-blue-dark);}

  /* teaching groups */
  .groups{display:flex;align-items:center;gap:8px;margin:18px 0 6px;flex-wrap:wrap;}
  .groups .g-label{font-size:.68rem;letter-spacing:normal;color:var(--ink-2);font-weight:600;margin-right:4px;}
  .gchip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:.8rem;color:var(--ink-2);cursor:pointer;font-family:inherit;transition:border-color .15s ease;}
  .gchip:not(.on):hover{border-color:var(--ec-blue);}
  .gchip .n{font-size:.66rem;color:var(--ink-3);}
  .gchip.on{background:var(--ec-blue);border-color:var(--ec-blue);color:#fff;}
  .gchip.on .n{color:rgba(255,255,255,.75);}
  .groups .g-note{font-size:.68rem;color:var(--ink-3);margin-left:4px;}

  /* layout */
  .work{display:grid;grid-template-columns:1fr 320px;gap:18px;margin-top:14px;align-items:start;}
  @media (max-width:1100px){.work{grid-template-columns:1fr;}}

  .resp-list{display:flex;flex-direction:column;gap:12px;}
  .resp{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .resp .r-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .resp .r-head .stu{width:30px;height:30px;border-radius:50%;background:#e6f4fb;color:var(--ec-blue-dark);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;}
  .resp .r-head b{font-size:.85rem;}
  .resp .r-head .grp{font-size:.62rem;font-weight:600;border-radius:99px;padding:2px 8px;background:#f5f8fa;border:1px solid var(--line);color:var(--ink-3);}
  .resp .r-head .score{margin-left:auto;display:flex;align-items:center;gap:6px;}
  .resp .r-head .score input{width:52px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.85rem;text-align:center;font-family:inherit;outline:none;}
  .resp .r-head .score input:focus{border-color:var(--ec-blue);}
  .resp .r-head .score small{font-size:.7rem;color:var(--ink-3);}
  .resp .ans{font-size:.84rem;color:var(--ink-2);line-height:1.7;background:#fafcfd;border:1px solid #eef3f6;border-radius:10px;padding:10px 14px;margin-bottom:10px;}
  .resp .tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .resp .tags .t-label{font-size:.68rem;color:var(--ink-3);}
  .skill{display:inline-flex;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:.72rem;color:var(--ink-2);cursor:pointer;font-family:inherit;transition:border-color .15s ease;}
  .skill:not(.on):hover{border-color:var(--ec-blue);}
  .skill.on{background:#effaf5;border-color:#bfe8d7;color:var(--ec-green);font-weight:600;}
  .skill.on.dev{background:#fdf6ec;border-color:#f3e3c3;color:#b07c10;}
  /* Add-tag picker — deliberately NOT a text input anywhere in here. The only
   * way to attach a tag is to click one of these buttons, and this list is
   * exactly SKILL_TAGS (vendor-data.js), nothing else. */
  .tag-menu{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(20,30,40,.14);padding:8px;min-width:260px;z-index:30;display:flex;flex-direction:column;gap:1px;}
  .tag-menu .tm-label{font-size:.64rem;color:var(--ink-3);font-weight:700;padding:4px 8px 8px;letter-spacing:normal;line-height:1.5;max-width:220px;}
  /* Each row is ONE skill name plus TWO separate level buttons — picking a
   * level is what commits the tag; there's no bare tag-name button that
   * would force a hidden default level. */
  .tag-menu .tm-row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:8px;}
  .tag-menu .tm-row:hover{background:#fafcfd;}
  .tag-menu .tm-name{flex:1;font-size:.78rem;color:var(--ink);}
  .tag-menu .tm-name small{display:block;font-size:.64rem;color:var(--ink-3);font-weight:400;}
  .tag-menu .tm-lvl{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:.68rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-2);white-space:nowrap;}
  .tag-menu .tm-lvl.secure:hover{background:#effaf5;border-color:#bfe8d7;color:var(--ec-green);}
  .tag-menu .tm-lvl.dev:hover{background:#fdf6ec;border-color:#f3e3c3;color:#b07c10;}
  .tag-menu .tm-empty{font-size:.74rem;color:var(--ink-3);padding:6px 9px;}

  /* side panel */
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:26px;}
  .panel h3{font-size:.9rem;font-weight:700;margin-bottom:12px;}
  .panel .prog{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--ink-2);margin-bottom:14px;}
  .panel .prog .bar{flex:1;height:7px;border-radius:99px;background:#dcedf8;overflow:hidden;}
  .panel .prog .bar i{display:block;height:100%;width:40%;background:var(--ec-blue);border-radius:99px;transition:width .3s;}
  .panel ul{list-style:none;display:flex;flex-direction:column;gap:9px;font-size:.76rem;color:var(--ink-2);}
  .panel ul li{display:flex;gap:8px;align-items:flex-start;line-height:1.55;}
  .panel ul li::before{content:"·";color:var(--ec-blue);font-weight:800;}
  .panel .release{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;}
  .panel .release .rel-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .panel .release .rel-head b{font-size:.8rem;}
  .panel .release .ped{font-size:.6rem;font-weight:700;color:var(--ec-green);background:#effaf5;border:1px solid #bfe8d7;border-radius:99px;padding:2px 8px;}
  .rel-opt{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;}
  .rel-opt.on,.rel-opt:has(input:checked){border-color:#bfe8d7;background:#f7fdf9;}
  .rel-opt input{margin-top:3px;accent-color:var(--ec-green);}
  .rel-opt b{font-size:.76rem;display:block;}
  .rel-opt small{font-size:.68rem;color:var(--ink-3);line-height:1.5;display:block;margin-top:2px;}
  .panel .sms{
    margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;font-size:.74rem;color:var(--ink-2);line-height:1.65;
    display:flex;gap:9px;align-items:flex-start;
  }
  .panel .sms .ok{color:var(--ec-green);font-weight:700;flex-shrink:0;}
  .finish{width:100%;margin-top:14px;border:none;border-radius:12px;padding:12px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;background:linear-gradient(120deg,var(--ec-blue),var(--ec-green));color:#fff;transition:filter .15s ease;}
  .finish:hover{filter:brightness(.93);}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.78rem;padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:120;}
  .toast.show{opacity:.94;}
  footer.note{margin-top:40px;font-size:.68rem;color:var(--ink-3);text-align:center;}
  @media (max-width:900px){.sidebar{display:none;}.main{padding:18px;}}

  .viewer-chip{display:inline-flex;align-items:center;gap:6px;font-size:.64rem;font-weight:700;color:var(--ec-blue-dark);background:#e6f4fb;border:1px solid #c4e5f5;border-radius:99px;padding:4px 10px;margin-top:14px;}

  /* Cross-class status. Read-only by design, and that constraint is the reason
   * the page is allowed to exist at all: the page deleted on 2026-08-18 was a
   * place to ASK, and it pulled scoping, seat arithmetic and cohort curation
   * onto the teacher. This is a place to CHECK. No assign, no cancel, no scope
   * editing — every row links back to the group it belongs to, and the action
   * happens there. If a button ever appears here, this has become the old page
   * under a new name. */
  .grp{margin-bottom:26px;}
  .grp h2{font-size:1rem;font-weight:800;margin-bottom:3px;}
  .grp .gsub{font-size:.74rem;color:var(--ink-3);margin-bottom:11px;}
  .srow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:13px 17px;margin-bottom:8px;flex-wrap:wrap;}
  .srow .st{font-size:.68rem;font-weight:700;border-radius:99px;padding:4px 11px;white-space:nowrap;}
  .st.ok{background:#effaf5;border:1px solid #bfe8d7;color:#0c6b48;}
  .st.wait{background:#fdf6e3;border:1px solid #efdcb0;color:#8a5a09;}
  .st.budget{background:#f3f0fb;border:1px solid #d8cff0;color:#4a3b7a;}
  .srow .tool{font-size:.84rem;font-weight:700;}
  .srow .where{font-size:.74rem;color:var(--ink-3);}
  .srow .when{margin-left:auto;font-size:.72rem;color:var(--ink-3);white-space:nowrap;}
  .srow .go{font-size:.74rem;color:var(--ec-blue-dark);text-decoration:none;font-weight:600;white-space:nowrap;}
  .srow .go:hover{text-decoration:underline;}
  .sum{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px;}
  .sum .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:130px;}
  .sum .s b{display:block;font-size:1.35rem;font-weight:800;line-height:1.2;}
  .sum .s span{font-size:.72rem;color:var(--ink-3);}
  .none{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;
    color:var(--ink-3);font-size:.8rem;line-height:1.8;}
  /* Portal switcher */
  .portal-sw{position:relative;padding:12px 12px 0;}
  .ps-btn{width:100%;display:flex;align-items:center;gap:9px;background:#f7fafc;border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;cursor:pointer;font-family:inherit;text-align:left;}
  .ps-btn:hover{border-color:var(--ec-blue);}
  .ps-ic{font-size:1rem;flex-shrink:0;}
  .ps-txt{flex:1;min-width:0;}
  .ps-txt small{display:block;font-size:.6rem;color:var(--ink-3);letter-spacing:.04em;}
  .ps-txt b{display:block;font-size:.82rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ps-car{font-size:.62rem;color:var(--ink-3);flex-shrink:0;}
  .portal-menu{position:absolute;top:calc(100% + 4px);left:12px;right:12px;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 30px rgba(20,30,40,.16);padding:6px;display:none;z-index:60;}
  .portal-menu.show{display:block;}
  .portal-menu a{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:9px;
    text-decoration:none;color:var(--ink-2);}
  .portal-menu a:hover{background:#f2f6f9;}
  .portal-menu a.on{background:#e6f4fb;}
  .portal-menu .pm-ic{font-size:.95rem;}
  .portal-menu b{display:block;font-size:.8rem;color:var(--ink);}
  .portal-menu small{display:block;font-size:.66rem;color:var(--ink-3);line-height:1.45;margin-top:1px;}
</style>
<!-- Loaded in <head>, not at the end of <body>: it injects the rules that
     hide feature-flagged elements, and those must exist before first paint
     or the flagged nav row and the 提案中 ribbons flash in and out. -->
<script src="feature-flags.js"></script>
</head>
<body>

<aside class="sidebar">
  <div class="logo-wrap">
    <img src="edcity_logo.svg" alt="香港教育城 EdCity">
    <div class="logo-sub">教學工具平台 · POC v0.1</div>
    <div class="viewer-chip">🧑‍🏫 課堂層級 · 教師視圖</div>
  </div>
  <!-- Portal switcher. The teacher's screens do two different jobs — making
       teaching material, and managing who her students are and what they may
       use. The second has approvals, statuses and a coordinator in it; leaving
       it inside the assistant made the assistant look like a governance
       product. Two shells, one control, and neither nav lists the other's
       pages. -->
  <div class="portal-sw">
    <button class="ps-btn" onclick="togglePortal()">
      <span class="ps-ic">🏫</span>
      <span class="ps-txt"><small>目前身處</small><b>課堂與學生</b></span>
      <span class="ps-car">▾</span>
    </button>
    <div class="portal-menu" id="portalMenu">
      <a href="chat.html" class=""><span class="pm-ic">✨</span><span><b>EdCity.ai</b><small>科目助理、工具箱、批改、教材</small></span></a>

        <div class="sub">你所有班別的教學工具狀態，一頁看完。要指派或停用工具，請開啟相關的分組。</div>

<script src="vendor-data.js"></script>
<script>
const MY_TEACHER_ID = 'T1001';
const WHOLE = '__whole_class__';
function myClasses(){ return CLASS_LIST.filter(c=>c.teacherId===MY_TEACHER_ID); }

function scopeName(classId, groupId){
  if(groupId===WHOLE) return '全班';
  const g = (CLASSES[classId].groups||[]).find(x=>x.id===groupId);
  return g ? g.name : groupId;
}
/* Every row this page can show, gathered from the same three sources the group
 * pages read. Nothing is computed differently here — if the two ever disagree,
 * this page is wrong, not the group page. */
function rows(){
  const out = [];
  myClasses().forEach(c=>{
    VENDORS.forEach(v=>{
      (v.grants||[]).forEach(g=>{
        if(g.classId===c.id) out.push({classId:c.id, groupId:g.groupId, status:'ok',
          tool:v.product, vendor:v.name, when:g.since+' 起'});
      });
      (v.pending||[]).forEach(p=>{
        if(p.status && p.status!=='pending' && p.status!=='queued') return;   // resolved
        if(p.classId===c.id && p.teacherId===MY_TEACHER_ID) out.push({classId:c.id, groupId:p.groupId,
          status:'wait', tool:v.product, vendor:v.name,
          when: p.status==='queued' ? '名額不足，處理中' : '已通知馮 Sir'});
      });
    });
    (typeof BUDGET_PENDING!=='undefined'?BUDGET_PENDING:[]).forEach(b=>{
      if(b.classId===c.id && b.teacherId===MY_TEACHER_ID) out.push({classId:c.id, groupId:b.groupId,
        status:'budget', tool:b.product, vendor:b.vendorName, when:'可用至 '+b.endsOn});
    });
  });
  return out;
}
const LABEL = {ok:'使用中', wait:'審批中', budget:'待預算'};

function render(){
  const all = rows();
  const by = k => all.filter(r=>r.status===k).length;
  document.getElementById('sum').innerHTML = `
    <div class="s"><b>${by('wait')}</b><span>等候審批</span></div>
    <div class="s"><b>${by('ok')}</b><span>使用中</span></div>
    <div class="s"><b>${by('budget')}</b><span>待預算</span></div>`;

  const wrap = document.getElementById('list');
  if(!all.length){
    wrap.innerHTML = '<div class="none">你目前沒有任何教學工具的申請或授權。<br><a href="groups.html" style="color:var(--ec-blue-dark);font-weight:600;">到「教學分組」開啟一個分組即可指派 →</a></div>';
    return;
  }
  /* Grouped by class, because "what is stuck" is nearly always asked about one
   * class at a time — and sorted wait-first, because that is the only status
   * she might act on (elsewhere). */
  const order = {wait:0, budget:1, ok:2};
  wrap.innerHTML = myClasses().map(c=>{
    const mine = all.filter(r=>r.classId===c.id).sort((a,b)=>order[a.status]-order[b.status]);
    if(!mine.length) return '';
    const waiting = mine.filter(r=>r.status==='wait').length;
    return `<div class="grp">
      <h2>${c.className}</h2>
      <div class="gsub">${mine.length} 項工具${waiting?` · ${waiting} 項等候審批`:''}</div>
      ${mine.map(r=>`<div class="srow">
        <span class="st ${r.status}">${LABEL[r.status]}</span>
        <span>
          <span class="tool">${r.tool}</span>
          <span class="where">· ${scopeName(r.classId, r.groupId)} · ${r.vendor}</span>
        </span>
        <span class="when">${r.when}</span>
        <a class="go" href="group-detail.html?c=${r.classId}&g=${r.groupId}">開啟分組 →</a>
      </div>`).join('')}
    </div>`;
  }).join('');
}
render();
</script>
